<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>魔法是可以配平的</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ead7;--paper:#fbf6ea;--paper2:#f6eedc;--ink:#3b2f22;--dim:#8a7a62;--line:#e0d2b4;--gold:#c08a2e;--gold2:#e7b75a;--me:#2f7d7a;--me2:#d5ece9;--her:#c8566b;--her2:#f6dbe0;--ok:#3f8f5a;--bad:#c0453a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:15px;line-height:1.55}
body{background:radial-gradient(ellipse at top,#fbf3e2 0%,var(--bg) 70%) fixed}
button{font-family:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:10px 12px calc(84px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:6px 2px 10px}
h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:21px;margin:0;color:#6b4a1c;letter-spacing:1px;cursor:default;user-select:none}
.sub{font-size:12px;color:var(--dim)}
.hstats{margin-left:auto;text-align:right;font-size:12px;color:var(--dim)}
.hstats b{color:var(--gold);font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fbf6eaee;backdrop-filter:blur(6px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:10}
nav .in{display:flex;max-width:640px;width:100%}
nav button{flex:1;border:none;background:none;padding:6px 0 4px;font-size:11.5px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;cursor:pointer}
nav button span{font-size:21px;line-height:1.1;filter:grayscale(.6);opacity:.75}
nav button.on{color:#6b4a1c;font-weight:700}
nav button.on span{filter:none;opacity:1}
nav .dot{position:absolute;top:3px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--her)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:10px;box-shadow:0 2px 0 #e7dbc0}
.card h3{margin:0 0 4px;font-family:'Noto Serif TC',serif;font-size:16px;color:#6b4a1c}
.sec{font-family:'Noto Serif TC',serif;font-size:16px;color:#6b4a1c;margin:16px 2px 8px;display:flex;align-items:baseline;gap:8px}
.sec small{font-family:'Noto Sans TC';font-size:12px;color:var(--dim);font-weight:400}
.sec.locked{color:#b3a68d}
.muted{color:var(--dim);font-size:13px}
.small{font-size:12px;color:var(--dim)}
.btn{display:block;width:100%;margin-top:8px;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--paper2);font-size:15px;cursor:pointer}
.btn.gold{background:linear-gradient(#f1c46c,#e0a744);border-color:#c99536;color:#4a3412;font-weight:700}
.btn.ghost{background:none;border-color:transparent;color:var(--dim)}
.btn:disabled{opacity:.45}
.btn:active{transform:scale(.985)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:#efe3c8;color:#7a5a24;margin-right:4px;white-space:nowrap}
.pill.me{background:var(--me2);color:var(--me)}
.pill.her{background:var(--her2);color:var(--her)}
.eq{font-family:'Noto Sans TC',ui-monospace,monospace;font-size:14.5px;background:#fffdf7;border:1px dashed var(--line);border-radius:9px;padding:7px 9px;margin:6px 0;overflow-x:auto;white-space:nowrap}
.eq .co{color:var(--gold);font-weight:700}
.eq .q{color:var(--her);font-weight:700}
/* town */
.banner{background:linear-gradient(135deg,#fff8e8,#f9ecd2);border:1px solid #ecd9ae;border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}
.banner b{color:#6b4a1c}
.town{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bld{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:10px 4px 8px;text-align:center;cursor:pointer;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px}
.bld .ic{font-size:32px;line-height:1.15}
.bld .nm{font-size:12.5px;font-weight:500}
.bld .bar{width:82%;height:6px;border-radius:3px;background:#eadfc6;overflow:hidden;display:flex;margin-top:4px}
.bld .bar i{display:block;height:100%}
.bld.wip .ic{filter:grayscale(1) opacity(.35)}
.bld.wip::after{content:'🏗️';position:absolute;top:6px;right:7px;font-size:15px}
.bld.done{border-color:#e2bf72;background:linear-gradient(#fffaf0,#fbefd3)}
.bld.done .ic{animation:bob 3s ease-in-out infinite}
.bld .need{position:absolute;top:5px;left:7px;font-size:11px;color:var(--her)}
.bld.lock{opacity:.45;cursor:default}
@keyframes bob{50%{transform:translateY(-3px)}}
.feed .ev{font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:6px}
.feed .ev:last-child{border:none}
.feed .t{color:var(--dim);font-size:11px;margin-left:auto;white-space:nowrap}
.who-me{color:var(--me);font-weight:700}
.who-her{color:var(--her);font-weight:700}
/* inventory */
.inv{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:18px;background:var(--paper);border:1px solid var(--line);font-size:13px;cursor:pointer}
.chip .sw{width:12px;height:12px;border-radius:50%;border:1px solid #0002;flex:none}
.chip b{color:var(--gold);font-weight:700}
.chip.raw{border-style:dashed}
.chip.zero{opacity:.45}
.rx{cursor:pointer}
.rx.no{opacity:.62}
.rx .miss{font-size:12px;color:var(--bad)}
.rx .can{font-size:12px;color:var(--ok)}
.tagrow{display:flex;justify-content:space-between;align-items:center}
/* modal */
#modal{position:fixed;inset:0;background:#2a1f1488;display:none;align-items:flex-end;justify-content:center;z-index:30}
#modal.show{display:flex}
.mbox{background:var(--paper);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:90vh;overflow-y:auto;animation:up .22s ease}
@media(min-width:700px){#modal{align-items:center}.mbox{border-radius:18px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.mbox h3{font-family:'Noto Serif TC',serif;color:#6b4a1c;margin:0 0 6px;font-size:18px}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:#fffdf7;font-size:14.5px;cursor:pointer;line-height:1.5}
.opt.right{border-color:var(--ok);background:#e6f3e8}
.opt.wrong{border-color:var(--bad);background:#f8e3df}
.opt:disabled{cursor:default}
.ex{background:#fff6e2;border-left:3px solid var(--gold);padding:7px 10px;border-radius:0 8px 8px 0;font-size:13.5px;margin:8px 0}
.ok{color:var(--ok);font-weight:700}
.bad{color:var(--bad);font-weight:700}

.bal{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 2px;margin:10px 0;font-size:15px}
.sp{display:flex;align-items:center;gap:2px}
.stp{display:flex;flex-direction:column;align-items:center}
.stp button{border:none;background:#efe3c8;border-radius:6px;width:28px;height:20px;font-size:11px;cursor:pointer;line-height:1}
.stp b{font-size:19px;color:var(--gold);min-width:24px;text-align:center;line-height:1.3}
.sp .f{font-size:15.5px;padding:0 2px}
.arrow{color:var(--dim);padding:0 4px}
.plus{color:var(--dim)}
table.tally{border-collapse:collapse;margin:6px auto;font-size:13.5px}
table.tally td,table.tally th{padding:3px 9px;border-bottom:1px solid var(--line);text-align:center}
table.tally th{color:var(--dim);font-weight:500}
table.tally td.y{color:var(--ok);font-weight:700}
table.tally td.n{color:var(--bad);font-weight:700}
.qty{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0}
.qty button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fffdf7;font-size:20px;cursor:pointer}
.qty b{font-size:24px;min-width:40px;text-align:center}
.need{margin:6px 0}
.need .lbl{display:flex;justify-content:space-between;font-size:13.5px}
.need .bar{height:9px;border-radius:5px;background:#eadfc6;overflow:hidden;display:flex;margin:3px 0 2px}
.need .bar i{display:block;height:100%}
.legend{font-size:11.5px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin:0 3px 0 8px}
.regions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.region{border:1px solid var(--line);border-radius:13px;padding:10px;background:var(--paper);cursor:pointer;text-align:center}
.region.on{border-color:var(--gold);box-shadow:0 0 0 2px #e7b75a55 inset}
.region .ic{font-size:28px}
.region .h{font-size:11.5px;color:var(--dim)}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px}
.gl .g{padding:9px 10px;border-radius:11px;border:1px solid var(--line);background:#fffdf7;cursor:pointer;text-align:left;font-size:13.5px}
.gl .g small{display:block;color:var(--dim);font-size:11.5px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.vs .p{border-radius:12px;padding:8px}
.vs .p.me{background:var(--me2)}
.vs .p.her{background:var(--her2)}
.vs .p b{font-size:22px;display:block}
.cardk{border-left:4px solid var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);opacity:0;background:#4a3412;color:#fff6e2;padding:9px 16px;border-radius:12px;font-size:14px;transition:.3s;z-index:40;max-width:88%;text-align:center;pointer-events:none}
.toast.show{transform:translateX(-50%);opacity:1}
.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.08)}}
.conf{position:fixed;top:-10px;font-size:20px;z-index:50;pointer-events:none;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.plaque{font-size:12px;background:#fbefd3;border:1px solid #ecd9ae;border-radius:8px;padding:4px 8px;margin-top:6px;display:inline-block}
.dq{font-size:15px;font-weight:500;margin:6px 0}
.hist td{padding:2px 8px;font-size:13px;text-align:center}
.foot{text-align:center;margin-top:20px}
.foot button{background:none;border:1px solid var(--line);border-radius:8px;color:var(--dim);font-size:12px;padding:5px 10px;cursor:pointer}
.bb{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.walk{animation:walk 20s linear infinite}
.mole-peek{animation:mpeek 7s ease-in-out infinite}
@keyframes mpeek{0%,12%{transform:translateY(16px)}22%,70%{transform:translateY(0)}76%{transform:translateY(-2px)}86%,100%{transform:translateY(16px)}}
.mole-bob{animation:mbob 1.2s ease-in-out infinite}
@keyframes mbob{50%{transform:translateY(-3px)}}
.mole-dance{animation:mdance .9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes mdance{25%{transform:rotate(-12deg) translateY(-3px)}75%{transform:rotate(12deg) translateY(-3px)}}
.mole-zz{animation:mzz 2.4s ease-in-out infinite}
@keyframes mzz{0%{opacity:0;transform:translate(0,0)}40%{opacity:1}100%{opacity:0;transform:translate(6px,-10px)}}
.moleic{display:inline-block;vertical-align:middle}
@keyframes walk{0%{transform:translateX(-20px)}50%{transform:translateX(370px)}50.01%{transform:translateX(370px) scaleX(-1)}100%{transform:translateX(-20px) scaleX(-1)}}
.smk{animation:smk 2.4s ease-out infinite}
@keyframes smk{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-14px)}}

@keyframes tw{50%{opacity:.2}}

 a3:['阿秤把每一顆麵粉都秤了一遍。「老師，要怎麼知道裡面有幾顆原子？」','「一莫耳就是 6.02×10²³ 個！好多……但用秤的就數得出來！」','阿秤幫麵包店算出剛好的配方：「先換成莫耳，再看係數比。」','「氣球升高時會變大，因為外面的壓力變小了！」阿秤追著氣球跑。','畢業典禮。阿秤的爸爸哭著說：「我兒子會算化學了。」','阿秤在市場當起「公平秤」的檢查員，誰的秤不準他一眼就看出來。','「化學反應前後，質量一克都不會少。就像兩位老師教我的，一點都不會白費。」'],
 a4:['小暖把手伸進澡堂的熱水裡。「老師，熱是從哪裡來的？」','「鹽溶進水裡，水會變冷一點點，為什麼？」小暖皺著眉。','小暖在冬天的路上撒鹽：「凝固點下降！路就不會結冰了。」','「放熱、吸熱、熵……原來水會往亂的方向跑！」','畢業典禮。小暖說要把澡堂改成全鎮最乾淨、最暖的地方。','鎮上的老人都說，小暖調的水溫剛剛好。','「溶液裡的每個粒子都在動，像大家在澡堂裡聊天一樣。」'],
 a5:['衡衡慢吞吞地走進教室。「老師，為什麼有些事很快，有些事很慢？」','「升溫會讓反應變快，因為有更多分子跳得過那座山！」','衡衡用兩個水桶來回倒水，倒到兩邊一樣高。「這就是平衡吧？」','「勒沙特列……就是你推它，它會往回推一點。」','畢業典禮。衡衡難得跑了起來，跑去擁抱兩位老師。','衡衡在農田幫忙算肥料的比例，收成比去年好很多。','「慢一點沒關係，只要方向對，最後都會到平衡。」'],
 a6:['檸檸皺著鼻子聞醋。「老師，酸到底是什麼？」','「pH 每差 1，酸度差十倍！我以前都以為只差一點點。」','檸檸調出了第一杯緩衝溶液，滴了酸進去 pH 也沒變。她得意得不得了。','「為什麼銀鹽一下子就沉下去？Ksp 好小喔！」','畢業典禮。檸檸嘴上說「這有什麼好哭的」，眼淚卻停不下來。','檸檸在鍊金公會負責驗水，井水哪裡怪怪的她都知道。','「嘴巴酸一點，心軟一點，就是剛剛好的緩衝。」'],
 a7:['雷雷的頭髮又被靜電電得豎起來。「老師，電子都跑到哪裡去了？」','「被氧化就是丟電子，被還原就是撿電子！我記住了！」','雷雷用鋅片和銅片做出了第一顆電池，小燈泡亮了一下。','「電解可以把鹽水拆開？那我是不是可以拆開全世界！」（不行。）','畢業典禮。雷雷說要繼承爺爺的雷之塔，讓全鎮的夜晚都亮起來。','雷之塔的燈第一次亮起的那晚，雷雷站在塔頂向兩位老師揮手。','「電子總會找到回家的路，就像我總會回來看兩位老師。」'],
 a8:['鏡鏡舉起左手又舉起右手。「老師，我分不清楚……分子也會這樣嗎？」','「碳連四個不一樣的東西，就有左手和右手！」','鏡鏡學會了命名：「主鏈先找最長的，編號要最小。」','「NMR 就像在聽每個氫原子說話。」鏡鏡閉上眼睛聽。','畢業典禮。鏡鏡終於分清楚左右手，用右手跟兩位老師握手。','鏡鏡在藥局幫忙檢查藥的結構，左旋右旋一個都不會搞錯。','「鏡子裡的我和我很像，卻不一樣。就像每個異構物都值得被認真看待。」'],
 a9:['森森從口袋掏出一塊苯環形狀的餅乾。「老師，碳為什麼這麼愛手牽手？」','「烯類的雙鍵可以加東西上去！溴水就褪色了！」','森森畫出了第一個反應機構，箭頭從電子多的地方指向電子少的地方。','「苯環好穩定，所以它喜歡取代而不是加成。」','畢業典禮。森森送給兩位老師一大盒苯環餅乾。','森森在染坊幫忙合成染料，鎮上第一次有了便宜的紫色衣服。','「每一支箭頭都是一個電子的小旅行。」'],
 a10:['香香一進門就說：「老師，你身上有醋酸乙酯的味道。」','「酒和醋在硫酸裡會變成果香，這叫酯化！」','香香做出了第一塊肥皂，泡泡裡有淡淡的橄欖香。','「柳樹皮的苦，原來可以變成阿斯匹靈……」香香若有所思。','畢業典禮。香香為兩位老師各調了一瓶專屬的香水。','香香在藥局工作，鎮上的人頭痛時都會去找她。','「每一種香味背後，都有一個官能基。每一段回憶背後，都有兩位老師。」'],
};
const BADGE=l=>l>=7?'👑':l>=5?'🎓':l>=3?'🎒':'';

// 每章：u 對應題庫單元；c 卡片 [標題, 內容]；q 小練習 [題目, [正解, 錯1, 錯2, 錯3], 解析]
const LESSONS=[
{id:'eq',u:'化學平衡',ic:'⚖️',t:'勒沙特列原理：被打擾就往回推',c:[
 ['💡 一句話','平衡被外界「打擾」時，會往<b>抵消這個打擾</b>的方向移動。加東西，它就想把那個東西用掉；拿走東西，它就想再做出來。'],
 ['🏠 生活例子','冷氣設 26°C，房間一熱，冷氣就更用力把溫度拉回來。平衡也一樣：加熱一個放熱反應，平衡就往<b>吸熱</b>（逆向）那邊跑，想把多的熱吃掉。<br><br>汽水打開會冒泡：瓶內壓力突然變小，CO₂(aq) ⇌ CO₂(g) 往產生氣體那邊移動，想把壓力補回來。'],
 ['🚀 真實世界','<b>哈柏法製氨</b> N₂ + 3H₂ ⇌ 2NH₃（放熱）：左邊 4 莫耳氣體、右邊 2 莫耳，所以用<b>高壓</b>推向氨。照理低溫產率較高，但太慢，所以工廠用約 400–500°C 加鐵觸媒，在「產率」和「速度」之間取捨。全世界的氮肥都靠它。<br><br>登山到高海拔，氧氣分壓下降，血紅素和氧的結合平衡往釋放的方向偏；身體幾週後會多造紅血球來適應。'],
 ['⚠️ 考試陷阱','• <b>觸媒不會移動平衡</b>，只會讓平衡更快達到。<br>• 加入<b>純固體或純液體</b>不會移動平衡（不出現在 K 裡）。<br>• <b>K 只隨溫度改變</b>。改濃度、壓力，K 不變，是 Q 暫時偏離 K。<br>• 定容下加入不參與反應的鈍氣：總壓變大，但各氣體分壓不變 → <b>不移動</b>。'],
 ['🧠 記法','先算 Q 跟 K 比：<b>Q &lt; K</b>，產物太少 → 往右；<b>Q &gt; K</b>，產物太多 → 往左。勒沙特列只是這件事的直覺版。']],
 q:[['N₂ + 3H₂ ⇌ 2NH₃ 為放熱反應。下列哪個改變會提高 NH₃ 的平衡產量？',['增加壓力（縮小體積）','加入鐵觸媒','升高溫度','定容下加入氬氣'],'左邊 4 莫耳氣體、右邊 2 莫耳，加壓往氣體莫耳數少的右邊移動。觸媒不移動平衡；升溫會往吸熱的逆向；定容加鈍氣分壓不變。'],
  ['對一個已達平衡的反應升高溫度，下列何者一定會改變？',['平衡常數 K','反應物的莫耳數一定增加','觸媒的用量','Q 一定變成 0'],'K 只跟溫度有關，溫度一變 K 就變（吸熱反應 K 變大，放熱反應 K 變小）。'],
  ['某反應此刻 Q = 5、K = 20，反應會？',['往正向（生成物方向）進行','往逆向進行','已達平衡','無法判斷'],'Q < K 表示生成物還太少，反應往右進行直到 Q = K。']]},

{id:'buf',u:'酸鹼',ic:'🧪',t:'緩衝溶液：血液 pH 為什麼不會亂掉',c:[
 ['💡 一句話','緩衝溶液＝<b>弱酸＋它的共軛鹼</b>（或弱鹼＋共軛酸）。加酸，共軛鹼把 H⁺ 接走；加鹼，弱酸把 OH⁻ 中和掉，所以 pH 變化很小。'],
 ['🏠 生活例子','像一個有兩個守門員的球門：一個專門擋酸、一個專門擋鹼。只要兩個守門員都還有體力（兩種成分都還夠多），球就很難進。'],
 ['🚀 真實世界','人的血液 pH 維持在 <b>7.35–7.45</b>，主要靠碳酸氫根緩衝：CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻。<br><br>過度換氣（喘太快）把 CO₂ 呼出太多 → 平衡往左 → H⁺ 變少 → <b>呼吸性鹼中毒</b>，手腳發麻。所以對著紙袋呼吸（吸回 CO₂）曾是常見的處置。肺和腎就是在調這個平衡。'],
 ['⚠️ 考試陷阱','• Henderson–Hasselbalch：<b>pH = pKa + log([A⁻]/[HA])</b>。[A⁻] = [HA] 時 pH = pKa。<br>• 緩衝能力最好的範圍大約是 <b>pKa ± 1</b>。<br>• 稀釋緩衝溶液，比值不變，pH 幾乎不變（但緩衝容量變小）。<br>• <b>強酸＋它的鹽</b>（如 HCl＋NaCl）不是緩衝溶液。<br>• 弱酸加一半當量的強鹼，也會形成緩衝，此時 pH = pKa（滴定的半當量點）。'],
 ['🧠 記法','要配 pH 5 的緩衝，就找 pKa 接近 5 的弱酸（例如醋酸，pKa ≈ 4.76）。']],
 q:[['下列哪一組可以配成緩衝溶液？',['CH₃COOH 與 CH₃COONa','HCl 與 NaCl','NaOH 與 NaCl','HNO₃ 與 KNO₃'],'緩衝需要弱酸與其共軛鹼。醋酸是弱酸、醋酸根是它的共軛鹼；其他組都是強酸或強鹼配它的鹽。'],
  ['某弱酸 pKa = 4.8，緩衝溶液中 [A⁻]/[HA] = 10，pH 約為？',['5.8','3.8','4.8','14'],'pH = pKa + log 10 = 4.8 + 1 = 5.8。'],
  ['一個人過度換氣、呼出大量 CO₂，血液會？',['pH 上升（偏鹼）','pH 下降（偏酸）','pH 不變','HCO₃⁻ 變成強酸'],'CO₂ 減少，CO₂ + H₂O ⇌ H⁺ + HCO₃⁻ 往左移，H⁺ 減少，pH 上升，即呼吸性鹼中毒。']]},

{id:'redox',u:'氧化還原',ic:'🔄',t:'氧化還原：電子去哪裡了',c:[
 ['💡 一句話','<b>失去電子＝氧化</b>，<b>得到電子＝還原</b>，兩件事一定同時發生。氧化數上升的被氧化，下降的被還原。'],
 ['🏠 生活例子','暖暖包裡是鐵粉：撕開接觸空氣，鐵被氧氣氧化（生鏽）放出熱。生鏽和暖暖包是同一個反應，只是暖暖包用鹽、活性碳讓它變快。<br><br>切開的蘋果變褐色，是果肉裡的酚類被氧化；擠點檸檬汁（維生素 C 是還原劑）就比較慢變色。'],
 ['🚀 真實世界','早期的酒測：橘色的二鉻酸鉀 Cr₂O₇²⁻ 把酒精氧化，自己被還原成綠色的 Cr³⁺，顏色變化就看得出喝了多少。<br><br>身體裡的粒線體，就是把食物的電子一路傳給氧氣，順便做出 ATP；這條電子傳遞鏈就是一連串的氧化還原。'],
 ['⚠️ 考試陷阱','• <b>氧化劑自己被還原</b>，還原劑自己被氧化。名字指的是它對「別人」做的事。<br>• 過氧化物（H₂O₂、Na₂O₂）中 O 是 <b>−1</b>；OF₂ 中 O 是 <b>+2</b>。<br>• 金屬氫化物（NaH）中 H 是 <b>−1</b>。<br>• 化合物所有氧化數總和＝0；離子＝電荷數。'],
 ['🧠 記法','<b>OIL RIG</b>：Oxidation Is Loss, Reduction Is Gain（電子）。']],
 q:[['2Na + Cl₂ → 2NaCl 中，哪一個是氧化劑？',['Cl₂','Na','NaCl','沒有氧化劑'],'Cl 從 0 變成 −1，得到電子被還原，所以 Cl₂ 是氧化劑；Na 被氧化，是還原劑。'],
  ['H₂O₂ 中氧的氧化數是？',['−1','−2','0','+1'],'過氧化物中 O–O 相連，每個 O 是 −1（H 是 +1，總和 0）。'],
  ['Cr₂O₇²⁻ 中 Cr 的氧化數是？',['+6','+7','+3','+12'],'2x + 7(−2) = −2 → 2x = 12 → x = +6。']]},

{id:'echem',u:'電化學',ic:'🔋',t:'電池：讓電子走外面的路',c:[
 ['💡 一句話','把氧化和還原<b>分開在兩邊</b>，電子只能經過外部電線過去，就變成電流。<b>陽極氧化、陰極還原</b>。'],
 ['🏠 生活例子','像兩個房間中間只開一扇門（電線）讓電子走，再開一條小走廊（鹽橋）讓離子走，維持兩邊電荷平衡。少了鹽橋，電子很快就流不動了。'],
 ['🚀 真實世界','<b>鋰離子電池</b>：放電時鋰離子從石墨負極出來，穿過電解質進到正極（如 LiCoO₂），電子則走外部電路幫手機供電；充電時反過來推回去。這項發明拿了 2019 年諾貝爾化學獎（Goodenough、Whittingham、吉野彰）。<br><br>神經訊號也是電化學：細胞膜兩側的 Na⁺、K⁺ 濃度差形成膜電位。'],
 ['⚠️ 考試陷阱','• 電池（賈法尼）：<b>陽極是負極</b>；電解：<b>陽極是正極</b>。但兩者都是「陽極氧化」。<br>• E°cell = E°陰極 − E°陽極（都用還原電位）。<br>• <b>E° 不隨係數倍數改變</b>（強度性質），ΔG 會。<br>• ΔG° = −nFE°：E° &gt; 0 → ΔG° &lt; 0 → 自發。<br>• 能斯特：E = E° − (0.0592/n) log Q（25°C）。'],
 ['🧠 記法','<b>An Ox, Red Cat</b>：Anode Oxidation, Reduction Cathode。電子從陽極流向陰極。']],
 q:[['Zn²⁺/Zn 的 E° = −0.76 V，Cu²⁺/Cu 的 E° = +0.34 V。鋅銅電池的 E°cell 是？',['1.10 V','0.42 V','−1.10 V','0.26 V'],'銅被還原（陰極）、鋅被氧化（陽極）：0.34 − (−0.76) = 1.10 V。'],
  ['在賈法尼電池中，下列敘述何者正確？',['電子由陽極經外電路流向陰極','陽極發生還原','陰極是負極','鹽橋讓電子通過'],'陽極氧化放出電子，經外電路到陰極。鹽橋走的是離子，不是電子。'],
  ['把半反應的係數全部乘以 2，下列何者不變？',['標準電位 E°','ΔG°','轉移的電子數 n','反應的總能量'],'E° 是強度性質，不隨係數改變；ΔG° = −nFE° 隨 n 加倍。']]},

{id:'thermo',u:'熱化學',ic:'🔥',t:'ΔG：會不會發生 ≠ 多快發生',c:[
 ['💡 一句話','<b>ΔG = ΔH − TΔS</b>。ΔG &lt; 0 就是自發，代表「會往這個方向走」，但<b>完全不代表多快</b>。'],
 ['🏠 生活例子','房間會自己變亂（熵增加），不會自己變整齊；要整理就得花力氣。<br><br>冰在室溫會融化：融化吸熱（ΔH &gt; 0，不利），但液體更亂（ΔS &gt; 0，有利），溫度夠高時 TΔS 贏過 ΔH，所以 0°C 以上自發融化。'],
 ['🚀 真實世界','<b>鑽石其實會自發變成石墨</b>（ΔG &lt; 0），只是能障太高，慢到人類壽命看不到。這就是「熱力學說會、動力學說慢」。<br><br>身體把不自發的反應（例如做蛋白質）跟 <b>ATP 水解</b>（ΔG°′ ≈ −30.5 kJ/mol）綁在一起，總 ΔG &lt; 0 就能發生。這叫反應偶聯。'],
 ['⚠️ 考試陷阱','四種組合：<br>• ΔH &lt; 0、ΔS &gt; 0：<b>任何溫度</b>都自發<br>• ΔH &gt; 0、ΔS &lt; 0：任何溫度都不自發<br>• ΔH &lt; 0、ΔS &lt; 0：<b>低溫</b>自發<br>• ΔH &gt; 0、ΔS &gt; 0：<b>高溫</b>自發<br>另外：ΔG° = −RT ln K，K &gt; 1 ↔ ΔG° &lt; 0。轉折溫度 T = ΔH/ΔS（單位要統一，ΔS 常是 J，ΔH 常是 kJ）。'],
 ['🧠 記法','ΔH 是「想不想」（放熱比較想），ΔS 是「亂不亂」（越亂越想），T 決定亂度有多重要。']],
 q:[['某反應 ΔH < 0、ΔS < 0，下列敘述何者正確？',['低溫時自發','任何溫度都自發','高溫時自發','任何溫度都不自發'],'ΔG = ΔH − TΔS：T 小時 −TΔS 這項（正值）影響小，ΔH 的負值主導，所以低溫自發。'],
  ['鑽石轉成石墨 ΔG < 0，但鑽石可以保存很久，原因是？',['活化能很高，反應極慢','其實 ΔG > 0','鑽石的熵比較大','需要觸媒才會自發'],'ΔG 只決定方向，速度由活化能決定（動力學）。'],
  ['某反應 ΔG° < 0，則其平衡常數 K？',['大於 1','小於 1','等於 1','等於 0'],'ΔG° = −RT ln K，ΔG° < 0 → ln K > 0 → K > 1。']]},

{id:'imf',u:'分子間力',ic:'🧲',t:'分子間力：沸點高低的祕密',c:[
 ['💡 一句話','沸騰時拆的是<b>分子之間</b>的吸引力，不是分子內的共價鍵。分子間力越強，沸點越高。強弱大致：<b>離子 &gt; 氫鍵 &gt; 偶極–偶極 &gt; 分散力</b>（同大小分子比較時）。'],
 ['🏠 生活例子','水（H₂O，分子量 18）是液體，但比它重的 H₂S（34）在室溫是氣體，差別就在水有氫鍵。<br><br>冰浮在水上，也是因為氫鍵把冰撐成比較空曠的結構，密度比液態水小。湖面先結冰，下面的魚才活得下來。'],
 ['🚀 真實世界','<b>壁虎</b>能倒掛在玻璃上，靠的是腳上幾百萬根細毛與表面之間的<b>分散力</b>（凡得瓦力）。單一個很弱，數量多就很強，科學家據此做出乾式黏膠。<br><br>DNA 雙股之間靠氫鍵配對（A–T 兩個、G–C 三個），所以 G–C 比例高的 DNA 比較難解開、熔點比較高。'],
 ['⚠️ 考試陷阱','• 氫鍵要 H 直接接在 <b>N、O、F</b> 上。CH₄ 沒有氫鍵；CH₃OH 有。<br>• 分散力存在於<b>所有</b>分子之間；分子越大、表面積越大，分散力越強（F₂ 氣、Br₂ 液、I₂ 固）。<br>• 同分子量時，直鏈比支鏈沸點高（接觸面積大）。<br>• 分子有極性鍵不一定是極性分子（CO₂、CCl₄ 對稱 → 非極性）。'],
 ['🧠 記法','比沸點三步：①有沒有離子或氫鍵 ②比分子大小（分散力）③比形狀和極性。']],
 q:[['下列何者沸點最高？',['H₂O','H₂S','H₂Se','CH₄'],'H₂O 有氫鍵，雖然分子量最小，沸點卻最高（100°C）。'],
  ['下列哪一個分子之間可以形成氫鍵？',['CH₃OH','CH₄','CH₃Cl','CH₃OCH₃'],'氫鍵需要 H 直接接在 N、O、F 上。甲醇有 O–H；二甲醚的 O 上沒有 H，分子之間不能互相形成氫鍵。'],
  ['F₂ 是氣體、I₂ 是固體，主要原因是？',['I₂ 分子較大，分散力較強','I₂ 有氫鍵','I₂ 是極性分子','F₂ 的共價鍵比較弱'],'兩者都是非極性分子，只有分散力；分子越大電子雲越容易被極化，分散力越強。']]},

{id:'chiral',u:'有機・異構',ic:'🤲',t:'手性：左手和右手不一樣',c:[
 ['💡 一句話','一個碳接著<b>四個不同的基團</b>，就是手性中心。它和它的鏡像像左右手，<b>無法重疊</b>，這一對叫鏡像異構物（enantiomers）。'],
 ['🏠 生活例子','左手套戴不進右手。分子也一樣：身體的酵素和受體本身就是「有手性的手套」，所以一對鏡像分子在身體裡的效果可以完全不同。<br><br>香芹酮的兩個鏡像異構物，一個聞起來像留蘭香（綠薄荷），一個像葛縷子，鼻子分得出左右手。'],
 ['🚀 真實世界','<b>沙利竇邁（反應停）事件</b>：1950–60 年代用來止孕吐，其中一個鏡像異構物有鎮靜效果，另一個會造成胎兒畸形，導致上萬名嬰兒受害。更麻煩的是兩者<b>在體內會互相轉換</b>，所以只吃「好的那個」也沒用。<br><br>這件事之後，藥廠必須分別研究每個鏡像異構物。現在很多藥（如 S-布洛芬、艾司西酞普蘭）都只賣單一鏡像。'],
 ['⚠️ 考試陷阱','• 鏡像異構物的熔點、沸點、溶解度<b>都相同</b>，只差旋光方向，以及和其他手性物質的作用。<br>• <b>R/S 和 (+)/(−) 沒有對應關係</b>：R 可以是左旋也可以是右旋。<br>• <b>內消旋（meso）</b>化合物有手性中心，但分子內有對稱面，整體沒有手性、不旋光。<br>• n 個手性中心最多 2ⁿ 個立體異構物（有 meso 時會更少）。<br>• 1:1 混合叫消旋混合物，不旋光。'],
 ['🧠 記法','判 R/S：最低優先基團朝後，1→2→3 順時針是 R（Right），逆時針是 S。']],
 q:[['下列哪一個分子含有手性中心？',['2-丁醇 CH₃CH(OH)CH₂CH₃','2-丙醇 (CH₃)₂CHOH','乙醇','1-丁醇'],'2-丁醇的 C2 接 H、OH、CH₃、C₂H₅ 四個不同基團；2-丙醇的中心碳接了兩個 CH₃。'],
  ['一對鏡像異構物，下列哪個性質不同？',['使平面偏振光旋轉的方向','沸點','在水中的溶解度','分子量'],'鏡像異構物在非手性環境中物理性質相同，只有旋光方向相反。'],
  ['內消旋（meso）化合物的特徵是？',['有手性中心但分子整體沒有手性','沒有任何手性中心','一定有旋光性','是鏡像異構物的 1:1 混合物'],'meso 分子內有對稱面，兩個手性中心的效果互相抵消；1:1 混合物則叫消旋混合物。']]},

{id:'sn',u:'有機・反應機構',ic:'🎯',t:'SN1 vs SN2：一步搶位，還是先空出位子',c:[
 ['💡 一句話','<b>SN2</b>：親核基從背面進攻，同時把離去基擠走，<b>一步完成</b>。<b>SN1</b>：離去基先自己走掉，形成碳陽離子，親核基再來，<b>兩步</b>。'],
 ['🏠 生活例子','SN2 像搶椅子：你直接從後面擠上去，原本坐著的人同時被擠下來，所以椅子周圍越空（甲基、一級碳）越好擠。<br><br>SN1 像先有人起身離開，位子空出來，誰都可以從兩邊坐上去，所以產物左右手都有（消旋）。位子空著要穩，所以三級碳陽離子最適合。'],
 ['🚀 真實世界','身體幫 DNA 或神經傳導物質加上甲基，用的是 <b>SAM（S-腺苷甲硫胺酸）</b>：受質的親核原子從背面進攻 SAM 上的甲基，就是典型的 SN2。<br><br>很多化療藥（烷化劑，如氮芥類）也是讓 DNA 的鹼基當親核基去進攻，把 DNA 黏住，癌細胞就無法複製。'],
 ['⚠️ 考試陷阱','• SN2：速率 = k[RX][Nu]，<b>構型反轉</b>，甲基 &gt; 1° &gt; 2°，3° 幾乎不發生；喜歡<b>極性非質子溶劑</b>（DMSO、丙酮）。<br>• SN1：速率 = k[RX]，<b>消旋化</b>，3° &gt; 2°，可能重排；喜歡<b>極性質子溶劑</b>（水、醇）。<br>• 2° 碳兩種都可能，看溶劑和親核基強弱。<br>• 強而大的鹼（如 t-BuO⁻）傾向發生<b>消去（E2）</b>，不是取代。<br>• 好的離去基是弱鹼：I⁻ &gt; Br⁻ &gt; Cl⁻ &gt; F⁻；OH⁻ 是差的離去基。'],
 ['🧠 記法','SN<b>2</b> 的「2」：速率看<b>兩個</b>東西；SN<b>1</b> 的「1」：只看<b>一個</b>（受質）。']],
 q:[['(CH₃)₃CBr 在水中進行取代反應，最可能的機構是？',['SN1','SN2','E2','自由基取代'],'三級碳背面擁擠，SN2 幾乎不可能；三級碳陽離子穩定，加上水是極性質子溶劑，走 SN1。'],
  ['(R)-2-溴丁烷與 OH⁻ 進行 SN2 反應，產物是？',['(S)-2-丁醇（構型反轉）','(R)-2-丁醇','消旋的 2-丁醇','1-丁醇'],'SN2 由背面進攻，幾何構型反轉。OH 接替了 Br 的最高優先順序，其他基團順序不變，所以標示由 R 變成 S。'],
  ['SN2 反應的速率式是？',['rate = k[RX][Nu⁻]','rate = k[RX]','rate = k[Nu⁻]','rate = k[RX]²'],'SN2 一步完成，受質和親核基都參與速率決定步驟。']]},

{id:'carbonyl',u:'有機・羰基',ic:'👁️',t:'羰基：被親核基攻擊的碳',c:[
 ['💡 一句話','C=O 中氧比較陰電性，把電子拉走，<b>羰基碳帶部分正電</b>，所以親核基會來攻擊它。醛和酮最常見的反應是<b>親核加成</b>。'],
 ['🏠 生活例子','葡萄糖其實是一個醛，但在水中大多數時候它會「自己咬自己的尾巴」：分子另一端的 OH 進攻自己的醛基，形成環狀的<b>半縮醛</b>。我們吃的澱粉、纖維素，就是這些環連成的長鏈。'],
 ['🚀 真實世界','<b>你現在能看見這行字</b>，靠的是羰基化學：視網膜上的 11-順-視黃醛（一個醛）與視蛋白的離胺酸胺基形成<b>亞胺（Schiff base）</b>。光一照，順式變成反式，蛋白質形狀改變，神經訊號就送出去了。<br><br>胡蘿蔔的 β-胡蘿蔔素在體內可以切成視黃醛，所以缺維生素 A 會夜盲。'],
 ['⚠️ 考試陷阱','• 反應性：<b>醛 &gt; 酮</b>（醛的立體障礙小，羰基碳也更正）。<br>• 多倫試劑（銀鏡）、斐林試劑可以分辨<b>醛（陽性）和酮（陰性）</b>；但 α-羥基酮如果糖也會呈陽性。<br>• 醛和酮做<b>加成</b>；羧酸衍生物（酯、醯氯、醯胺）有離去基，做<b>醯基取代</b>。<br>• 醯基取代反應性：醯氯 &gt; 酸酐 &gt; 酯 &gt; 醯胺。<br>• 一級醇氧化成醛（再到羧酸）；二級醇氧化成酮；三級醇不易氧化。'],
 ['🧠 記法','碳氧雙鍵＝「氧把電子拉走、碳變成空位」，任何帶電子的東西（Nu⁻、胺、醇、格任亞試劑）都想去碰那個碳。']],
 q:[['多倫試劑（Tollens）可以用來區分下列哪一組？',['丙醛與丙酮','乙醇與甲醇','苯與甲苯','乙酸與乙酸乙酯'],'醛可被多倫試劑氧化，產生銀鏡；一般的酮不會。'],
  ['醛與一級胺反應，主要產物是？',['亞胺（Schiff base）','醯胺','酯','醚'],'一級胺對羰基進行親核加成，再脫水形成 C=N 亞胺；視黃醛和視蛋白的結合就是這個反應。'],
  ['下列羧酸衍生物，何者對親核醯基取代反應性最高？',['醯氯','醯胺','酯','酸酐'],'Cl⁻ 是最好的離去基，醯氯最活潑；醯胺的 N 會共振提供電子，最不活潑。']]},

{id:'arom',u:'有機・芳香',ic:'💍',t:'芳香性：特別穩定的環',c:[
 ['💡 一句話','一個環要有芳香性，必須同時滿足：<b>環狀、平面、每個環原子都參與共軛</b>，而且 π 電子數 = <b>4n + 2</b>（2、6、10…，休克耳規則）。'],
 ['🏠 生活例子','苯的六個 π 電子不屬於任何一個雙鍵，而是平均分散在整個環上，像一群人手牽手圍成圈，比兩兩一對更穩。所以苯不喜歡做加成（會打斷圈圈），而是做<b>取代</b>（換掉一個 H，圈圈還在）。'],
 ['🚀 真實世界','DNA 的四種鹼基（A、T、G、C）都是芳香雜環，平平的環可以一層層<b>疊在一起</b>（π 堆疊），讓雙股螺旋更穩。<br><br>很多藥物都有芳香環，例如阿斯匹靈、普拿疼（乙醯胺酚）。石墨烯可以看成無限延伸的芳香片，導電性極好。'],
 ['⚠️ 考試陷阱','• 環辛四烯（8 π）<b>不是平面</b>（彎成澡盆狀），所以是非芳香。<br>• 環戊二烯陰離子（6 π）芳香；環戊二烯陽離子（4 π）反芳香。<br>• <b>吡啶</b>的 N 孤對電子不在 π 系統內，所以吡啶有鹼性；<b>吡咯</b>的 N 孤對電子在 π 系統內（湊成 6 π），所以吡咯幾乎沒有鹼性。<br>• 苯的親電取代：活化基（–OH、–NH₂、–CH₃）是<b>鄰對位</b>導向；鈍化基（–NO₂、–COOH、–CN）是<b>間位</b>導向；鹵素是鈍化但鄰對位導向。'],
 ['🧠 記法','數 π 電子：雙鍵每個 2，環上帶負電的碳 2、帶正電的碳 0；孤對電子要看它是不是「被需要」才能湊成共軛。']],
 q:[['下列何者具有芳香性？',['環戊二烯陰離子','環辛四烯','環丁二烯','環戊二烯陽離子'],'環戊二烯陰離子有 6 個 π 電子（4n+2，n=1），平面且完全共軛。'],
  ['苯與 Br₂（FeBr₃ 催化）反應，主要產物是？',['溴苯（取代）','1,2-二溴環己二烯（加成）','環己烷','沒有反應'],'苯做親電芳香取代，保住芳香環；加成會破壞芳香性。'],
  ['吡咯的鹼性比吡啶弱很多，原因是？',['吡咯 N 的孤對電子參與芳香 π 系統','吡咯沒有氮原子','吡啶不是芳香化合物','吡咯是非平面分子'],'吡咯 N 的孤對電子是湊成 6 π 電子的必要部分，拿去接 H⁺ 會破壞芳香性；吡啶 N 的孤對電子在環平面上，不參與 π 系統。']]},

{id:'acid',u:'有機・羧酸',ux:['有機・醇醚','有機・胺'],ic:'🍋',t:'酸鹼強弱：放手之後穩不穩',c:[
 ['💡 一句話','比較兩個分子誰的<b>酸性</b>比較強，不用背 pKa，只要問：<b>H⁺ 離開後留下的負電荷，有沒有辦法被分攤、被安撫？</b>共軛鹼越穩，酸就越願意放手，越強。<br><br><b>鹼性</b>反過來看：氮或氧上的孤對電子越「閒」（沒被別人拉走、沒被分出去），越願意去抓 H⁺，鹼就越強。'],
 ['🏠 生活例子','負電荷就像<b>燙手山芋</b>。一個人拿著會很痛苦，所以不太願意接（不愛放出 H⁺）。如果旁邊有好幾個人可以一起傳、輪流拿，每個人只燙一點，就沒那麼痛苦了。<br><br><b>醋 vs. 酒</b>：醋酸 CH₃COOH 放掉 H⁺ 之後，負電由<b>兩個氧</b>輪流分擔（共振），所以醋是酸的（pKa ≈ 4.8）。酒精 CH₃CH₂OH 放掉 H⁺ 之後，負電只能卡在<b>一個氧</b>上，所以酒精幾乎不酸（pKa ≈ 16，跟水差不多）。兩者都是 O–H，差別只在「放手之後有沒有人幫忙」。'],
 ['🔍 四個判斷工具','依照影響大小，從上往下檢查：<br><b>① 原子</b>：負電荷落在哪個原子上？同一列比陰電性（C &lt; N &lt; O &lt; F，越右越穩）；同一族比大小（越大越穩，所以 HI 酸性 &gt; HF）。<br><b>② 共振</b>：負電能不能分散到其他原子？羧酸根分給兩個 O；酚氧離子分進苯環。<br><b>③ 誘導效應</b>：附近有沒有拉電子基（F、Cl、NO₂）幫忙拉走負電？<b>越近越有效</b>，隔幾個碳就幾乎沒感覺。烷基則是輕微推電子，酸性略降。<br><b>④ 軌域</b>：負電在 sp &gt; sp² &gt; sp³ 軌域上越穩（s 成分越多，電子越靠近核）。所以末端炔的 H 有微弱酸性，烷類完全沒有。'],
 ['🚀 真實世界','<b>擠檸檬去魚腥味</b>：魚腥味主要來自<b>三甲胺</b>，它是會揮發的鹼。檸檬酸把它質子化變成銨鹽（帶正電的離子），離子不會飄進鼻子，味道就消失了。這就是一個酸鹼反應。<br><br><b>藥名裡的「鹽酸」</b>：很多藥是胺類，本身不太溶於水。做成鹽酸鹽（例如鹽酸二甲雙胍、鹽酸舍曲林）之後，胺被質子化成離子，才溶得進水、做成好吸收的藥錠。<br><br><b>石炭酸</b>：酚（C₆H₅OH）的負電可以分進苯環，所以它比醇酸得多（pKa ≈ 10）。19 世紀李斯特用它幫手術器械消毒，開啟了無菌手術。'],
 ['⚠️ 考試陷阱','• 酸性排序：<b>羧酸（~5）&gt; 酚（~10）&gt; 水（15.7）≈ 醇（~16）&gt; 末端炔（~25）&gt; 胺的 N–H（~35）&gt; 烷（~50）</b>。<br>• 酚雖然有共振，但負電分進苯環時是落在<b>碳</b>上，不如羧酸根全落在兩個 O 上穩，所以酚比羧酸弱。<br>• 拉電子基<b>越多、越近、越陰電性</b>，酸越強：CF₃COOH（~0.2）≫ ClCH₂COOH（~2.9）&gt; CH₃COOH（~4.8）。<br>• 醚（R–O–R）的 O 上沒有 H，<b>不能當酸</b>。<br>• 胺的鹼性：<b>脂肪胺 &gt; NH₃ &gt; 苯胺 ≫ 醯胺</b>（醯胺幾乎中性）。苯胺 N 的孤對電子被苯環分走；醯胺 N 的孤對電子被 C=O 分走。<br>• 比較鹼性時看的是<b>共軛酸的 pKa（pKaH）</b>：pKaH 越大，鹼越強。甲胺的 pKaH ≈ 10.6，苯胺只有 ≈ 4.6。<br>• 水中的胺不一定是三級最鹼：三級胺的銨離子比較難被水分子包圍穩定，通常<b>二級胺</b>最強。'],
 ['🧠 記法','<b>酸：看放手後的負電有沒有人分擔</b>（原子 → 共振 → 誘導 → 軌域）。<br><b>鹼：看孤對電子閒不閒</b>，被共振拉走的就不閒。<br>同一個工具，一正一反，羧酸、醇、酚、胺、醯胺全部可以用它來推。']],
 q:[['下列化合物的酸性由強到弱，何者正確？',['乙酸 &gt; 酚 &gt; 乙醇','酚 &gt; 乙酸 &gt; 乙醇','乙醇 &gt; 酚 &gt; 乙酸','乙酸 &gt; 乙醇 &gt; 酚'],'乙酸根的負電由兩個 O 共振分擔（pKa ~4.8）；酚氧離子的負電可分進苯環，但會落到碳上（pKa ~10）；乙氧離子的負電只能留在一個 O 上（pKa ~16）。'],
  ['下列何者酸性最強？',['ClCH₂COOH','CH₃COOH','ClCH₂CH₂CH₂COOH','CH₃CH₂OH'],'Cl 是拉電子基，離羧基越近越能穩定羧酸根。ClCH₂COOH 的 Cl 緊鄰羧基（pKa ~2.9）；4-氯丁酸的 Cl 隔了三個碳，效果幾乎消失（pKa ~4.5）。'],
  ['下列何者在水中的鹼性最強？',['甲胺 CH₃NH₂','苯胺 C₆H₅NH₂','乙醯胺 CH₃CONH₂','吡咯'],'甲胺 N 的孤對電子沒有被分走，甲基還會輕微推電子。苯胺的孤對電子被苯環共振分走；乙醯胺的孤對電子被羰基分走；吡咯的孤對電子是芳香 π 系統的一部分。'],
  ['擠檸檬汁可以減少魚腥味，主要原因是？',['檸檬酸把會揮發的三甲胺質子化成不揮發的銨鹽','檸檬酸把三甲胺氧化成無味的物質','檸檬的香氣分子把腥味蓋過去','檸檬酸和三甲胺發生酯化反應'],'三甲胺 (CH₃)₃N 是鹼，接上 H⁺ 後變成 (CH₃)₃NH⁺，成為離子就不容易揮發。這是酸鹼反應，不是氧化或酯化。']]},

{id:'name',u:'有機・命名',ic:'🏷️',t:'IUPAC 命名：幫分子寫地址',c:[
 ['💡 一句話','IUPAC 名字就是分子的<b>地址</b>：<b>位置號 + 取代基 + 主鏈 + 官能基字尾</b>。只要三步：<b>① 找主鏈 → ② 編號 → ③ 掛上取代基</b>。'],
 ['🏠 生活例子','寫地址時會先定出「哪一條路」，再寫「幾號」。命名也一樣：先決定主鏈（路名），再決定從哪一頭開始編號（門牌），讓重要的東西號碼越小越好。<br><br>藥局賣的<b>異丙醇</b>（酒精棉片）IUPAC 名是 <b>2-丙醇</b>：三個碳的主鏈（丙）、OH 在第 2 個碳上（2-…醇）。去光水的<b>丙酮</b>就是 propanone：三個碳、中間是 C=O（酮）。'],
 ['🔍 三個步驟','<b>① 找主鏈</b>：要<b>包含最重要的官能基</b>，再挑最長的那條。主鏈常常是<b>彎的</b>，不一定是畫成一直線的那條。<br><b>② 編號</b>：從靠近<b>主官能基</b>的一端開始；沒有官能基時，讓取代基位置號整組最小（逐一比較，第一個不同的號碼小的贏）。<br><b>③ 掛取代基</b>：英文名依<b>字母順序</b>排（ethyl 在 methyl 前面），di-、tri- 這些倍數字首不算進字母排序。<br><br>官能基優先序（高 → 低）：<b>羧酸 &gt; 酯 &gt; 醯胺 &gt; 醛 &gt; 酮 &gt; 醇 &gt; 胺 &gt; 烯、炔 &gt; 烷基、鹵素</b>。最高的那個當字尾，其他的都變成字首（例如 OH 變成「羥基 hydroxy-」）。'],
 ['🚀 真實世界','<b>加油站的 95、98</b>：辛烷值的 100 分基準是<b>異辛烷</b>，正式名稱 <b>2,2,4-三甲基戊烷</b>（2,2,4-trimethylpentane）；0 分基準是正庚烷。95 無鉛的抗爆震能力，相當於 95% 異辛烷加 5% 正庚烷的混合物。<br><br>名字裡的數字直接告訴你結構：主鏈 5 個碳（戊烷），第 2 個碳上有兩個甲基，第 4 個碳上有一個甲基。分支多的烷類燃燒比較平順，所以抗爆震。'],
 ['⚠️ 考試陷阱','• 「2,2,4」和「2,4,4」選哪個？從第一個數字開始比，2 = 2，再比第二個數字 2 &lt; 4，所以選 <b>2,2,4</b>。不是把數字加起來比。<br>• 沒有「1-甲基」：甲基掛在第 1 個碳上，代表主鏈其實可以再長一個碳，要重找主鏈。同理，「2-乙基」通常也代表主鏈找錯了。<br>• 烯、炔的雙鍵、三鍵要包在主鏈裡，而且編號要讓它的號碼盡量小：CH₂=CHCH₂CH₃ 是 <b>1-丁烯</b>。<br>• 雙鍵兩側有不同基團時要標 cis/trans 或 E/Z。<br>• 環狀化合物在主鏈名稱前加「環」（cyclo-）。'],
 ['🧠 記法','<b>先找主角（主官能基），再找舞台（最長鏈），讓主角站在號碼最小的位置。</b>名字寫完反過來畫一次結構，畫得回原本的分子就對了。']],
 q:[['(CH₃)₂CHCH₂CH₃ 的 IUPAC 名稱是？',['2-甲基丁烷','3-甲基丁烷','2-乙基丙烷','異戊烷基丙烷'],'最長鏈是 4 個碳（丁烷），從靠近分支的一端編號，甲基在 C2。「3-甲基」是編號方向錯了；「2-乙基丙烷」代表主鏈找錯了。'],
  ['汽油辛烷值基準「異辛烷」的 IUPAC 名稱是？',['2,2,4-三甲基戊烷','2,4,4-三甲基戊烷','1,1,1,3-四甲基丙烷','2-甲基-4,4-二甲基戊烷'],'從兩端編號會得到 2,2,4 或 2,4,4，第二個數字 2 &lt; 4，所以選 2,2,4。相同取代基要合併寫成「三甲基」。'],
  ['HOCH₂CH₂CHO 的 IUPAC 名稱是？',['3-羥基丙醛','3-醛基-1-丙醇','1-羥基-3-丙醛','3-丙醛醇'],'醛的優先序比醇高，所以醛當字尾（丙醛），CHO 的碳為 C1；OH 變成字首「羥基」，位在 C3。'],
  ['CH₃CH=CHCH₂CH₃ 的名稱是？',['2-戊烯','3-戊烯','2-戊炔','1-戊烯'],'5 個碳、有一個雙鍵（戊烯）。從左邊編號，雙鍵在 C2–C3，取小的號碼 2；從右邊編號會得到 3，比較大。']]},

{id:'elim',u:'有機・反應機構',ux:['有機・烴'],ic:'🪝',t:'消去 vs 取代：碰碳還是拔氫',c:[
 ['💡 一句話','鹵烷遇到帶負電的試劑有兩條路：試劑去<b>碰碳</b>（當親核基）就是<b>取代</b>；試劑去<b>拔旁邊碳上的 H</b>（當鹼）就是<b>消去</b>，H 和離去基一起離開，留下 <b>C=C 雙鍵</b>。<br><br><b>E2</b>：拔 H 和離去基離開同時發生，一步完成。<b>E1</b>：離去基先走，形成碳陽離子，再掉一個 H⁺，分兩步。'],
 ['🏠 生活例子','想像中間的碳被一圈人（基團）圍住，你要拿到它：<br>• 個子小、手長的人（OH⁻、CN⁻）可以擠進去碰到中間的碳 → <b>取代</b>。<br>• 個子大、擠不進去的人（如 t-BuO⁻）只能拔外圍的 H → <b>消去</b>。<br>• 中間圍得越擠（三級碳），越沒有人碰得到碳，消去就越佔優勢。<br><br>另外，消去會把一個分子變成好幾個分子，亂度變大，所以<b>加熱有利消去</b>。'],
 ['🔍 判斷流程','先看碳是幾級，再看試劑：<br><b>一級碳（1°）</b>：一般親核基 → <b>SN2</b>；大體積強鹼（t-BuOK）→ <b>E2</b>。<br><b>二級碳（2°）</b>：強鹼（OH⁻、RO⁻）→ 主要 <b>E2</b>；弱鹼但好的親核基（I⁻、CN⁻、RS⁻、N₃⁻）配極性非質子溶劑 → <b>SN2</b>；水、醇這類弱的 → SN1／E1。<br><b>三級碳（3°）</b>：不會走 SN2。強鹼 → <b>E2</b>；弱鹼或只在溶劑中 → <b>SN1 + E1</b>，加熱時 E1 比例變多。'],
 ['🚀 真實世界','<b>甘蔗做的塑膠袋</b>：巴西的 Braskem 把甘蔗發酵成乙醇，再用酸觸媒讓乙醇<b>脫水</b>（一種消去反應：拿掉 H 和 OH）變成乙烯，做成「綠色聚乙烯」。分子和石油做的一模一樣，只是碳來自植物。<br><br><b>身體裡也有</b>：檸檬酸循環中，烏頭酸酶先讓檸檬酸脫掉一分子水，形成帶雙鍵的順烏頭酸，再把水加回去，轉成異檸檬酸。'],
 ['⚠️ 考試陷阱','• <b>查依采夫規則（Zaitsev）</b>：一般的鹼生成<b>取代基較多、較穩定</b>的烯為主產物。<br>• <b>大體積鹼</b>（t-BuO⁻）拔不到裡面的 H，生成<b>取代基較少</b>的烯（霍夫曼產物，Hofmann）。<br>• E2 的幾何要求：H 和離去基必須<b>反式共平面</b>（anti-periplanar）。在環己烷上，兩者都要在<b>直立鍵</b>（axial）位置。<br>• E1 經過碳陽離子，可能<b>重排</b>，而且常和 SN1 一起發生。<br>• 速率式：E2 = k[RX][鹼]，E1 = k[RX]。<br>• 醇的酸催化脫水（濃 H₂SO₄、加熱）也是消去，二級、三級醇走 E1。'],
 ['🧠 記法','<b>小而強的親核基碰碳，大而強的鹼拔氫；碳越擠、溫度越高，越容易消去。</b><br>查依采夫：H 從<b>氫比較少</b>的那個鄰碳被拔走（「窮的越窮」），雙鍵就落在比較多取代的位置。']],
 q:[['2-溴丁烷與乙氧化鈉（NaOCH₂CH₃）在乙醇中加熱，主產物是？',['2-丁烯','1-丁烯','2-丁醇','丁烷'],'二級碳加上強鹼並加熱，主要走 E2。依照查依采夫規則，生成取代較多的 2-丁烯（以反式為主）。'],
  ['2-溴-2-甲基丁烷與 t-BuOK 反應，主產物是？',['2-甲基-1-丁烯','2-甲基-2-丁烯','2-甲基-2-丁醇','3-甲基-1-丁烯'],'t-BuO⁻ 體積大，拔不到 C3 上較擠的 H，只能拔外側甲基的 H，生成取代較少的霍夫曼產物 2-甲基-1-丁烯。'],
  ['E2 反應中，被拔掉的 H 與離去基的幾何關係必須是？',['反式共平面（anti-periplanar）','順式同側（syn）且互相垂直','位在同一個碳上','沒有幾何限制'],'E2 一步完成，C–H 鍵的電子要從背面推出離去基，兩者需在同一平面、方向相反。'],
  ['下列哪一組條件最有利於 SN2，而不是 E2？',['CH₃CH₂Br + NaCN，DMSO','(CH₃)₃CBr + NaOCH₃','CH₃CH₂Br + t-BuOK','(CH₃)₂CHBr + NaOEt，加熱'],'一級碳立體障礙小，CN⁻ 是好的親核基但鹼性不強，在極性非質子溶劑 DMSO 中走 SN2。其他三組都有強鹼搭配擁擠的受質、大體積鹼或加熱，傾向消去。']]},

{id:'spec',u:'光譜',ic:'🔦',t:'光譜判讀：IR 看工具，NMR 看鄰居',c:[
 ['💡 一句話','每一種光譜回答一個不同的問題：<br>• <b>IR（紅外線）</b>：分子身上有<b>哪些官能基</b>？（不同的鍵吸收不同頻率的紅外光而振動）<br>• <b>¹H NMR</b>：有<b>幾種</b>氫、各在<b>什麼環境</b>、各有<b>幾個</b>、<b>鄰居</b>有幾個 H？<br>• <b>MS（質譜）</b>：分子有<b>多重</b>？碎成哪些片段？'],
 ['🏠 生活例子','把未知分子當成嫌疑人：<br>• IR 是<b>搜身</b>：看他帶了什麼工具（C=O、O–H、N–H）。<br>• NMR 是<b>查戶口</b>：每個氫住哪一區（化學位移）、隔壁住幾個人（分裂）、家裡幾口人（積分）。<br>• MS 是<b>量體重</b>：分子量多少、身上有沒有 Cl 或 Br 這類特徵。<br><br>三份資料合起來，通常就能把結構拼出來。'],
 ['🔍 要記的數字','<b>IR（cm⁻¹）</b><br>• 3200–3550 寬而圓：醇的 O–H<br>• 2500–3300 非常寬、蓋住 C–H：羧酸的 O–H<br>• 3300–3500 尖：N–H（一級胺兩根、二級胺一根）<br>• ~1700 又強又尖：<b>C=O</b>（最好認）<br>• ~2250：C≡N；~3300 尖：≡C–H<br><b>¹H NMR（ppm）</b><br>• 0.9–1.5：一般烷基 H<br>• 2.0–2.5：接在 C=O 或苯環旁的 C–H<br>• 3.3–4.0：接在 O 上的 C–H（醇、醚、酯）<br>• 4.5–6.5：烯的 H　• 6.5–8：苯環的 H<br>• 9–10：<b>醛的 H</b>　• 10–12：羧酸的 H'],
 ['🚀 真實世界','<b>醫院的 MRI 就是 NMR</b>：它偵測的正是體內水分子和脂肪裡的氫原子核在磁場中的訊號，原名是「核磁共振造影」，因為病人怕「核」這個字，才把 nuclear 拿掉。<br><br><b>警察的酒測</b>：作為法律證據的呼氣酒精分析儀，很多是用<b>紅外線</b>量乙醇 C–H 鍵的吸收。<br><br><b>運動禁藥檢測</b>：用層析把尿液成分分開，再用質譜看分子量和碎片，就能認出極微量的藥物。'],
 ['⚠️ 考試陷阱','• <b>n+1 規則</b>：鄰近碳上有 n 個等價的 H，訊號就分裂成 n+1 根峰。乙基 CH₃CH₂– 的特徵是 <b>CH₃ 三重峰 + CH₂ 四重峰</b>。<br>• 等價的 H <b>不會互相分裂</b>。醇的 O–H 通常交換很快，是<b>單峰</b>，也不分裂旁邊的 H。<br>• 旁邊的拉電子基越強（O、鹵素、C=O），化學位移越大（往左，去遮蔽）。<br>• 積分（峰面積）是各種 H 的<b>個數比</b>，不是絕對數量。<br>• MS：含 <b>Cl</b> 的分子有 M 和 M+2 兩個峰，高度約 <b>3:1</b>；含 <b>Br</b> 約 <b>1:1</b>（同位素天然豐度）。<br>• ¹³C NMR 看的是有<b>幾種碳</b>，一般不看分裂。'],
 ['🧠 記法','<b>IR 先找 1700（有沒有 C=O）和 3300 附近（有沒有 OH／NH）</b>，大方向就定了。<br>NMR 四問：<b>幾組峰</b>（幾種 H）→ <b>在哪裡</b>（旁邊是誰）→ <b>分幾根</b>（鄰居 n 個 H）→ <b>面積多大</b>（幾個 H）。']],
 q:[['某化合物的 IR 在 1715 cm⁻¹ 有強而尖的吸收，3200–3600 cm⁻¹ 沒有寬峰。最可能是？',['2-丁酮','2-丁醇','丁酸','乙醚'],'1715 是 C=O；沒有 O–H 寬峰就排除醇和羧酸（丁酸會有非常寬的 O–H）。乙醚沒有 C=O。'],
  ['溴乙烷 CH₃CH₂Br 的 ¹H NMR 圖譜應該是？',['一組三重峰（3H）和一組四重峰（2H）','兩組單峰','一組二重峰（3H）和一組三重峰（2H）','一組單峰（5H）'],'CH₃ 的鄰居是 CH₂（2 個 H）→ 2+1 = 三重峰；CH₂ 的鄰居是 CH₃（3 個 H）→ 3+1 = 四重峰。CH₂ 接 Br，化學位移較大。'],
  ['¹H NMR 在 9.7 ppm 出現一個積分 1H 的峰，最可能代表？',['醛基的 H（–CHO）','苯環上的 H','醇的 O–H','甲基的 H'],'9–10 ppm 幾乎只有醛基 H 會出現：它直接接在羰基碳上，被強烈去遮蔽。'],
  ['某化合物的質譜中，M 和 M+2 兩個峰高度約為 1:1，分子中最可能含有？',['溴','氯','氮','氧'],'溴有 ⁷⁹Br 和 ⁸¹Br 兩種同位素，豐度約各半，所以 M:M+2 ≈ 1:1。氯是 ³⁵Cl:³⁷Cl ≈ 3:1。']]},

{id:'bio',u:'有機・生化',ic:'🧬',t:'生命的積木：連起來脫水，拆開加水',c:[
 ['💡 一句話','生物的大分子都是<b>小積木串成的長鏈</b>。串起來時掉一分子水（<b>脫水縮合</b>），拆開時加回一分子水（<b>水解</b>）。<br>• 胺基酸 →（<b>肽鍵</b>）→ 蛋白質<br>• 單醣 →（<b>醣苷鍵</b>）→ 澱粉、纖維素<br>• 甘油 + 3 個脂肪酸 →（<b>酯鍵</b>）→ 三酸甘油酯（油脂）<br>• 核苷酸 →（<b>磷酸二酯鍵</b>）→ DNA、RNA'],
 ['🏠 生活例子','<b>煎蛋變白</b>：加熱讓蛋白質的摺疊散開（<b>變性</b>），胺基酸的順序沒變，但形狀變了，就從透明變成白色固體，而且回不去。<br><br><b>飯越嚼越甜</b>：唾液裡的澱粉酶把澱粉<b>水解</b>成麥芽糖。<br><br><b>做肥皂</b>：油脂加上氫氧化鈉，酯鍵被水解（<b>皂化</b>），得到甘油和脂肪酸鈉，脂肪酸鈉就是肥皂。'],
 ['🚀 真實世界','<b>澱粉和纖維素都是葡萄糖</b>，差別只在連接的角度：澱粉是 <b>α-1,4</b>，纖維素是 <b>β-1,4</b>。人體只有切 α 鍵的酶，所以米飯能消化，紙和菜梗不行。牛和白蟻是靠腸胃裡的微生物幫忙切 β 鍵。<br><br><b>反式脂肪</b>：植物油「部分氫化」可以變成固態，但過程中會產生反式雙鍵，會提高心血管疾病風險。台灣從 2018 年起禁止食品使用不完全氫化油。'],
 ['⚠️ 考試陷阱','• 胺基酸在生理 pH 下是<b>兩性離子</b>（–NH₃⁺ 和 –COO⁻ 同時存在）；淨電荷為零時的 pH 叫<b>等電點 pI</b>。<br>• 除了<b>甘胺酸</b>，α-胺基酸都有手性，天然蛋白質用的是 <b>L 型</b>。<br>• 蛋白質結構：一級 = 胺基酸序列（肽鍵）；二級 = α 螺旋、β 摺板（主鏈間氫鍵）；三級 = 側鏈作用（含雙硫鍵）；四級 = 多條鏈組合。<b>變性破壞二到四級結構，肽鍵不斷</b>。<br>• <b>蔗糖不是還原糖</b>（兩個單醣的端點互相綁住）；葡萄糖、果糖、麥芽糖、乳糖都是。<br>• 飽和脂肪酸鏈直、排得緊 → 熔點高（豬油）；順式雙鍵讓鏈彎曲 → 排不緊 → 液態（植物油）。<br>• DNA：A–T 兩個氫鍵、G–C 三個氫鍵，GC 比例越高越難解開。'],
 ['🧠 記法','<b>連起來脫水，拆開加水。</b>看到任何生物大分子，先問「積木是什麼、用什麼鍵連」，大部分考題就有方向了。']],
 q:[['煮蛋時蛋白質變性，主要被破壞的是？',['二、三級結構（氫鍵與側鏈作用），肽鍵沒有斷','肽鍵被水解成胺基酸','胺基酸被氧化成其他分子','一級結構的胺基酸序列改變'],'加熱讓維持摺疊的氫鍵和側鏈作用被破壞，但肽鍵很穩定，序列不變。'],
  ['人體無法消化纖維素，主要原因是？',['人體沒有能切斷 β-1,4-醣苷鍵的酶','纖維素不是由葡萄糖組成','纖維素分子太小，直接被排出','纖維素含有肽鍵'],'纖維素和澱粉都是葡萄糖聚合物，差在 β 與 α 鍵結；人只有切 α 鍵的澱粉酶。'],
  ['下列何者不是還原糖？',['蔗糖','葡萄糖','麥芽糖','果糖'],'蔗糖由葡萄糖和果糖的端點（半縮醛／半縮酮碳）互相連接，沒有游離的醛基可以開環，所以不是還原糖。'],
  ['室溫下橄欖油是液態、豬油是固態，主要原因是？',['橄欖油含較多順式不飽和脂肪酸，鏈彎曲排列鬆散','橄欖油的分子量比豬油大很多','豬油含有大量氫鍵','橄欖油含有較多反式脂肪'],'順式雙鍵讓碳鏈彎曲，分子無法緊密堆疊，分散力較弱，熔點較低。飽和脂肪酸的鏈是直的，排得緊，熔點高。']]}
];

 res:{look:'藥丸裡有鮮紅色、很重的粉末。',heat:'在通風的地方加熱粉末，冒出刺鼻的氣體，管壁冷處凝結出<b>銀色的小液滴</b>。',na2s:'沒有明顯變化；這個粉末幾乎不溶於水，也不溶於一般的酸。',exam:'手部細微顫抖、牙齦發炎、情緒不穩。',flame:'沒有特別的焰色。'},
 key:['look','heat'],cand:['硃砂（HgS）','雄黃（As₄S₄）','鉛丹（Pb₃O₄）','赭石（Fe₂O₃）','硫磺（S）'],cut:['赭石（Fe₂O₃）','硫磺（S）'],
 exp:'硃砂是天然的<b>硫化汞 HgS</b>，傳統用於安神類方劑。加熱時：<b>HgS + O₂ → Hg + SO₂</b>，SO₂ 刺鼻，汞蒸氣在冷處凝成銀色液滴（汞是常溫唯一的液態金屬）。<br><br>長期攝入汞會累積在神經系統：<b>顫抖、牙齦炎、情緒與性格改變</b>。歐洲製帽工人用汞處理毛氈，出現類似症狀，英文才有 mad as a hatter 的說法。',
 pt:'硃砂＝HgS；加熱生成 Hg 與 SO₂；汞中毒三聯：顫抖、牙齦炎、精神改變。'},
{id:'as',ic:'🐉',t:'端午的雄黃酒',u:'氧化還原',

{id:'no2',ic:'🧂',t:'看起來像鹽的白粉',u:'氧化還原',

{id:'cn',ic:'🌰',t:'山裡的苦杏仁',u:'錯合物',

{id:'op',ic:'🌾',t:'噴完藥的農夫',u:'有機・生化',

{id:'pb',ic:'🏺',t:'漂亮的釉彩酸梅壺',u:'溶解度',

{id:'cu',ic:'🎆',t:'標籤掉了的煙火粉',u:'原子結構',

{id:'glu',ic:'🐜',t:'招螞蟻的尿',u:'有機・生化',

{id:'dka',ic:'🍎',t:'呼吸有水果味',u:'有機・羰基',

function donOf(src,b,i){return src&&src.don&&src.don[b]&&src.don[b][i]||0}
function prog(b){const need=BDM[b][4];let r={};for(const i in need){const a=donOf(save,b,i),p=donOf(P,b,i);r[i]={me:a,pa:p,need:need[i]}}return r}
function bDone(b){const p=prog(b);return Object.values(p).every(x=>x.me+x.pa>=x.need)}
function chDoneN(c){return BD.filter(b=>b[1]===c&&bDone(b[0])).length}
function chOpen(c){return true} // 四章一開始全部開放：想練哪一區就蓋哪一區
const curCh=()=>[4,3,2].find(chOpen)||1;
function bPct(b){const p=prog(b);let t=0,m=0,q=0;for(const i in p){t+=p[i].need;m+=Math.min(p[i].me,p[i].need);q+=Math.min(p[i].pa,Math.max(0,p[i].need-Math.min(p[i].me,p[i].need)))}return[m/t,q/t]}

function seedRng(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}let a=h>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dailyQs(d){const r=seedRng(d+'#balance');const gs=shuffle(GEN.filter(g=>g.l>=2),r).slice(0,2).map(g=>genQ(g,r));
 const org=+d.slice(-2)%2===1;let pool=QB.map((q,i)=>i).filter(i=>QB[i][4]>=2&&(QB[i][3].startsWith('有機')||QB[i][3]==='光譜')===org);const qi=pool[Math.floor(r()*pool.length)],q=QB[qi];
 const qs=[...gs,{q:q[0],o:q[1].slice(),ex:q[2],t:q[3],u:'',lv:q[4]}];
 return qs.map(g=>{const right=g.o[0];g.o=shuffle(g.o,r);g.a=g.o.indexOf(right);return g})}

const ucOf=(src,u)=>src===save?uStat(u)[0]:(P&&P.uc[u])||0;
function appXP(a){return APPM[a].u.reduce((t,u)=>t+ucOf(save,u)+ucOf(P,u),0)}
function appLv(a){const x=appXP(a);let l=1;ALV.forEach((v,i)=>{if(x>=v)l=i+1});return l}
function unlocked(b){const x=BX[b];return!x||(appLv(x[0])>=x[1]&&(x[1]<3||rsDone(b)))}
const rsDone=b=>!!(save.rs[b]||(P&&P.rs[b]));
function town(){
 const built=BD.filter(b=>bDone(b[0]));const have={};NEEDS.forEach(([k])=>have[k]=0);
 built.forEach(b=>{const e=(BX[b[0]]||[0,0,{}])[2];for(const k in e)have[k]+=e[k]});
 const pop=30+built.length*12+have['居']*10,dem=1+pop/70;
 const sat={};NEEDS.forEach(([k])=>sat[k]=Math.min(1,have[k]/dem));
 const mood=NEEDS.reduce((t,[k])=>t+sat[k],0)/NEEDS.length;
 const low=NEEDS.map(([k])=>k).sort((a,b)=>sat[a]-sat[b])[0];
 const fix=BD.filter(b=>!bDone(b[0])&&BX[b[0]]&&BX[b[0]][2][low]).sort((x,y)=>(unlocked(y[0])-unlocked(x[0]))||(BX[x[0]][1]-BX[y[0]][1]))[0];
 return{built:built.length,pop,sat,mood,low,fix};
}

  case'd_pnb':{const fp=dbgFakeP();fp.nb=fp.nb||[];const qi=Math.floor(Math.random()*QB.length),q=QB[qi],o=shuffle(q[1]);

  case'd_day':TOFF++;try{localStorage.setItem('mb_toff',String(TOFF))}catch(e){}PQ=null;return done(`現在是 ${todayStr()}`);

 const L=LESSONS.slice().sort((a,b)=>lessonScore(b)-lessonScore(a)),done=LESSONS.filter(l=>save.ls[l.id]).length;
 let h=`<div class="sec">📖 講堂<small>用生活例子看懂常錯的概念，讀完做小練習，學徒也會長經驗（${done}/${LESSONS.length}）</small></div><div class="card">`;
 L.forEach((l,i)=>{const x=save.us[l.u]||[0,0],t=x[0]+x[1],pr=P&&P.ls&&P.ls[l.id],pn=P&&P.ln&&P.ln[l.id],ap=APPM[U2A[l.u]];
  h+=`<div data-a="lesson" data-v="${l.id}" style="display:flex;align-items:center;gap:10px;padding:8px 2px;cursor:pointer;${i?'border-top:1px dashed var(--line);':''}">
   <div style="font-size:24px">${l.ic}</div><div style="flex:1"><div><b>${l.t}</b>${save.ls[l.id]?' <span class="ok">✓</span>':''}</div>
   <div class="small">${l.u}${ap?` · ${ap.ic}${ap.nm}`:''}${t?` · 你的答對率 ${Math.round(x[0]/t*100)}%`:''}${i<3&&!save.ls[l.id]&&t&&x[1]/t>.3?' · <span class="bad">推薦</span>':''}${pr?` · ${paN()}讀過`:''}${pn?` · 💬${paN()}的補充`:''}</div></div><div>›</div></div>`});
 return h+'</div>';
}
let LS=null;
function openLesson(id){const l=LESM[id];if(!l)return;LS={id,k:0,qi:-1,pick:-1,ok:0,ord:l.q.map(q=>shuffle(q[1].slice()))};drawLesson()}
function drawLesson(){
 const l=LESM[LS.id],nc=l.c.length,dots=[...Array(nc+1)].map((_,i)=>`<i style="display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 2px;background:${i===Math.min(LS.k,nc)?'var(--gold)':'#e3d6b8'}"></i>`).join('');
 let h=`<div class="small" style="text-align:center">${dots}</div><h3 style="margin-top:6px">${l.ic} ${l.t}</h3>`;
 if(LS.k<nc){const[c,b]=l.c[LS.k];
  h+=`<div class="sec" style="margin-top:6px">${c}</div><div style="line-height:1.75;font-size:14.5px">${b}</div>
  <div class="row" style="margin-top:12px">${LS.k?'<button class="btn" style="flex:1" id="lsprev">← 上一張</button>':''}<button class="btn gold" style="flex:2" id="lsnext">${LS.k===nc-1?'做小練習 ✏️':'下一張 →'}</button></div>`;
 }else if(LS.qi<l.q.length){if(LS.qi<0)LS.qi=0;const q=l.q[LS.qi],o=LS.ord[LS.qi],done=LS.pick>=0;
  h+=`<div class="sec" style="margin-top:6px">✏️ 小練習 ${LS.qi+1}/${l.q.length}</div><div class="dq">${q[0]}</div>
  ${o.map((x,i)=>`<button class="opt ${done?(x===q[1][0]?'right':i===LS.pick?'wrong':''):''}" data-k="${i}" ${done?'disabled':''}>${x}</button>`).join('')}
  ${done?`<div class="ex">${o[LS.pick]===q[1][0]?'<span class="ok">✓ 答對了！</span>':'<span class="bad">✗ 再想想。</span>'} ${q[2]}</div><button class="btn gold" id="lsq">${LS.qi===l.q.length-1?'完成 →':'下一題 →'}</button>`:''}
  <button class="btn ghost" id="lsback">← 回去看卡片</button>`;
 }else{const first=!save.ls[l.id],mine=(save.lnote[l.id]||{}).txt||'',pn=P&&P.ln&&P.ln[l.id];
  h+=`<div class="ex" style="text-align:center">小練習答對 ${LS.ok}/${l.q.length}${LS.rw?`<br>${LS.rw}`:''}</div>
  ${pn?`<div class="sec">💬 ${paN()}的補充</div><div class="ex" style="white-space:pre-wrap">${esc(pn.txt)}</div>`:''}
  <div class="sec">✍️ 我的補充<small>你的記法、口訣或提醒，${paN()}也看得到</small></div>
  <textarea id="lsnote" maxlength="300" style="width:100%;height:72px;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px">${esc(mine)}</textarea>
  <button class="btn" id="lssave">儲存補充</button><button class="btn" id="lsagain">再看一次</button>`;
 }
 modal(h+'<button class="btn ghost" data-a="close">關閉</button>');
 const m=$('modal'),on=(id,f)=>{const e=m.querySelector('#'+id);if(e)e.onclick=f};
 on('lsnext',()=>{LS.k++;drawLesson()});on('lsprev',()=>{LS.k--;drawLesson()});on('lsback',()=>{LS.k=0;drawLesson()});
 on('lsagain',()=>openLesson(LS.id));
 on('lsq',()=>{LS.qi++;LS.pick=-1;if(LS.qi>=l.q.length)finishLesson();drawLesson()});
 m.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{if(LS.pick>=0)return;LS.pick=+b.dataset.k;if(LS.ord[LS.qi][LS.pick]===l.q[LS.qi][1][0])LS.ok++;drawLesson()});
 on('lssave',()=>{const t=m.querySelector('#lsnote').value.trim().slice(0,300);if(t)save.lnote[l.id]={txt:t,ts:Date.now()};else delete save.lnote[l.id];persist();toast(t?`已儲存，${paN()}會看到`:'已清除補充')});
}
function finishLesson(){
 const l=LESM[LS.id];if(save.ls[l.id]){LS.rw='';return}
 // 第一次讀完：答對的小練習算學徒經驗，也算進今天一起答對的題數
 save.ls[l.id]=Date.now();const ap=APPM[U2A[l.u]];
 if(LS.ok){const x=save.us[l.u]||[0,0];x[0]+=LS.ok;save.us[l.u]=x;const td=todayStr();save.pdOk=save.pdOk[0]===td?[td,save.pdOk[1]+LS.ok]:[td,LS.ok]}
 LS.rw=`🎉 第一次讀完！${LS.ok&&ap?`${ap.ic}${ap.nm} 經驗 +${LS.ok}`:''}`;pushEv({k:'les',u:l.u});persist();checkLv();checkGoal();
}

// ===================== 🔍 小鎮事件簿 =====================
function caseList(){
 const done=CASES.filter(c=>save.cs[c.id]).length,L=CASES.slice().sort((a,b)=>(save.cs[a.id]?1:0)-(save.cs[b.id]?1:0));
 let h=`<div class="sec" id="casesec">🔍 小鎮事件簿<small>看症狀和現場、自己選實驗，推理出是什麼化學物質（${done}/${CASES.length}）</small></div><div class="card">`;
 L.forEach((c,i)=>{const m=save.cs[c.id],pc=P&&P.cs&&P.cs[c.id],pn=P&&P.cn&&P.cn[c.id];
  h+=`<div data-a="case" data-v="${c.id}" style="display:flex;align-items:center;gap:10px;padding:8px 2px;cursor:pointer;${i?'border-top:1px dashed var(--line);':''}">
   <div style="font-size:24px">${c.ic}</div><div style="flex:1"><div><b>${c.t}</b>${m?` <span style="color:var(--gold)">${'★'.repeat(m.s)}</span>`:''}</div>
   <div class="small">${m?'已破案':CS[c.id]?'調查中…':'未解決'}${pc?` · ${paN()}破案 ${'★'.repeat(pc.s)}`:''}${pn?` · 💬${paN()}的推理`:''}</div></div><div>›</div></div>`});
 return h+'</div>';
}
const CS={}; // 調查中的狀態（只在這次開啟期間保留）
function caseStars(st){return Math.max(1,3-st.hint-st.wrong.length-(st.done.length>CFREE+2?1:0))}
function openCase(id){const c=CASEM[id];if(!c)return;if(!CS[id]||save.cs[id]&&CS[id].stage==='sol')CS[id]={id,done:[],hint:0,wrong:[],stage:save.cs[id]?'sol':'inv',ord:shuffle(c.cand)};CS.cur=id;drawCase()}
function drawCase(){
 const st=CS[CS.cur],c=CASEM[st.id],solved=!!save.cs[c.id];let h=`<h3>${c.ic} ${c.t}</h3>`;
 if(st.stage==='inv'){
  h+=`<div style="line-height:1.75;font-size:14.5px">${c.story}</div>`;
  if(st.done.length)h+=`<div class="sec">🧪 檢驗紀錄</div>`+st.done.map(t=>`<div class="ex"><b>${TESTM[t][1]} ${TESTM[t][2]}</b>：${c.res[t]||TDEF}</div>`).join('');
  const left=CFREE-st.done.length;
  h+=`<div class="sec">要做哪個實驗？<small>不花材料，想做幾個都可以${left>-2?'':'（超過 5 個會少一顆星）'}</small></div><div class="inv">${TESTS.filter(t=>!st.done.includes(t[0])).map(t=>`<span class="chip" data-t="${t[0]}" title="${t[3]}">${t[1]} ${t[2]}</span>`).join('')}</div>`;
  if(st.hint>=1)h+=`<div class="ex">💡 提示：先試試 ${c.key.map(k=>`<b>${TESTM[k][1]}${TESTM[k][2]}</b>`).join('、')}。${st.hint>=2?'<br>💡 已經幫你刪掉兩個不可能的答案。':''}</div>`;
  h+=`<div class="row" style="margin-top:10px"><button class="btn" style="flex:1" id="cshint" ${st.hint>=2?'disabled':''}>💡 ${st.hint===0?'沒頭緒？給提示':st.hint===1?'再多一點提示':'提示已用完'}</button><button class="btn gold" style="flex:1" id="csans">🧠 我知道是什麼了</button></div>
  <div class="small" style="text-align:center">目前可得 ${'★'.repeat(caseStars(st))}${'☆'.repeat(3-caseStars(st))}　（用提示、猜錯、實驗做太多都會少星）</div>`;
 }else if(st.stage==='ans'){
  h+=`<div class="small">${c.story}</div>${st.done.length?`<div class="small" style="margin-top:6px">${st.done.map(t=>`${TESTM[t][1]} ${c.res[t]||TDEF}`).join('<br>')}</div>`:''}<div class="sec">是什麼造成的？</div>`+st.ord.map(o=>{const out=st.wrong.includes(o)||(st.hint>=2&&c.cut.includes(o));return`<button class="opt" data-o="${esc(o)}" ${out?'disabled style="opacity:.4;text-decoration:line-through"':''}>${o}</button>`}).join('')+
   `<button class="btn ghost" id="csback">← 回去再查查看</button>`;
 }else{
  const m=save.cs[c.id],pc=P&&P.cs&&P.cs[c.id],pn=P&&P.cn&&P.cn[c.id],mine=(save.cnote[c.id]||{}).txt||'';
  h+=`<div class="ex" style="text-align:center"><b>真相：${c.cand[0]}</b><br><span style="color:var(--gold);font-size:18px">${'★'.repeat(m.s)}${'☆'.repeat(3-m.s)}</span>${st.rw?`<br>${st.rw}`:''}</div>
  <div style="line-height:1.75;font-size:14.5px">${c.exp}</div><div class="ex">📌 考點：${c.pt}</div>
  ${pc?`<div class="small">${paN()}也破了這個案子：${'★'.repeat(pc.s)}</div>`:`<div class="small">${paN()}還沒破這個案子</div>`}
  ${pn?`<div class="sec">💬 ${paN()}的推理</div><div class="ex" style="white-space:pre-wrap">${esc(pn.txt)}</div>`:''}
  <div class="sec">✍️ 我的推理<small>你是怎麼想到的、哪條線索最關鍵，${paN()}也看得到</small></div>
  <textarea id="csnote" maxlength="300" style="width:100%;height:72px;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px">${esc(mine)}</textarea>
  <button class="btn" id="cssave">儲存推理</button><button class="btn" id="csagain">重新調查一次（不再給獎勵）</button>`;
 }
 modal(h+'<button class="btn ghost" data-a="close">關閉</button>');
 const M=$('modal'),on=(id,f)=>{const e=M.querySelector('#'+id);if(e)e.onclick=f};
 M.querySelectorAll('.chip[data-t]').forEach(b=>b.onclick=()=>{st.done.push(b.dataset.t);drawCase();const r=M.querySelectorAll('.ex');if(r.length)r[st.done.length-1]&&r[st.done.length-1].scrollIntoView({block:'nearest'})});
 on('cshint',()=>{st.hint=Math.min(2,st.hint+1);drawCase()});
 on('csans',()=>{st.stage='ans';drawCase()});on('csback',()=>{st.stage='inv';drawCase()});
 M.querySelectorAll('.opt[data-o]').forEach(b=>b.onclick=()=>{const o=b.dataset.o;
  if(o===c.cand[0]){st.stage='sol';finishCase(st)}else{st.wrong.push(o);toast('不是它，再查查看線索吧');st.stage='inv'}drawCase()});
 on('cssave',()=>{const t=M.querySelector('#csnote').value.trim().slice(0,300);if(t)save.cnote[c.id]={txt:t,ts:Date.now()};else delete save.cnote[c.id];persist();toast(t?`已儲存，${paN()}會看到`:'已清除')});
 on('csagain',()=>{CS[c.id]={id:c.id,done:[],hint:0,wrong:[],stage:'inv',ord:shuffle(c.cand),replay:1};drawCase()});
}
function finishCase(st){
 const c=CASEM[st.id];st.rw='';if(save.cs[c.id]||st.replay)return;
 const s=caseStars(st),ap=APPM[U2A[c.u]];save.cs[c.id]={s,ts:Date.now()};
 const x=save.us[c.u]||[0,0];x[0]+=s;save.us[c.u]=x;const td=todayStr();save.pdOk=save.pdOk[0]===td?[td,save.pdOk[1]+1]:[td,1];
 const got={};for(let i=0;i<s;i++){const it=rewardItem();got[it]=(got[it]||0)+2;addInv(it,2)}
 st.rw=`🎉 破案！${ap?`${ap.ic}${ap.nm} 經驗 +${s}　·　`:''}鎮民謝禮：${Object.keys(got).map(i=>nm(i)+'×'+got[i]).join('、')}`;
 pushEv({k:'case',u:c.u});persist();checkLv();checkGoal();
}

// ===================== 🐾 莫耳（小鎮的鼴鼠信差） =====================
// mole＝鼴鼠＝莫耳。幫兩個人送信：對方寫了東西、破了案，牠就叼著信來
function moleBody(){return`<ellipse cx="0" cy="-10" rx="11" ry="12" fill="#8a6a52"/><ellipse cx="0" cy="-6" rx="7" ry="7" fill="#c4a185"/>
 <ellipse cx="-5" cy="-21" rx="3.4" ry="2.6" fill="#bfe3f2" stroke="#5b4636" stroke-width="1"/><ellipse cx="5" cy="-21" rx="3.4" ry="2.6" fill="#bfe3f2" stroke="#5b4636" stroke-width="1"/><path d="M-1.6 -21h3.2" stroke="#5b4636" stroke-width="1"/>
 <path d="M-6 -14q2 -2 4 0M2 -14q2 -2 4 0" stroke="#3a2a1e" stroke-width="1.1" fill="none" stroke-linecap="round"/>
 <circle cx="-7" cy="-10" r="1.8" fill="#f4a0a0" opacity=".75"/><circle cx="7" cy="-10" r="1.8" fill="#f4a0a0" opacity=".75"/>
 <circle cx="0" cy="-10.5" r="2.3" fill="#ff8fa3"/><circle cx="-.7" cy="-11.2" r=".7" fill="#fff" opacity=".8"/>
 <ellipse cx="-8" cy="-3" rx="3.2" ry="2.2" fill="#f2c4b0"/><ellipse cx="8" cy="-3" rx="3.2" ry="2.2" fill="#f2c4b0"/>`}
function moleIcon(sz,mail){return`<svg class="moleic" width="${sz}" height="${sz}" viewBox="-16 -30 32 32"><g class="${mail?'mole-bob':''}">${moleBody()}${mail?'<text x="5" y="-16" font-size="9">✉️</text>':''}</g></svg>`}
function moleMail(){
 if(!P)return[];const t=save.mlSeen||0,out=[],pn=paN();
 const nb=nbNew();if(nb)out.push(['nbk',`📒 筆記本有 ${nb} 則${pn}新寫的東西`]);
 for(const k in P.ln)if(P.ln[k].ts>t&&P.ln[k].txt&&LESM[k])out.push(['l:'+k,`📖 ${pn}在講堂「${LESM[k].t}」寫了補充`]);
 for(const k in P.cn)if(P.cn[k].ts>t&&P.cn[k].txt&&CASEM[k])out.push(['c:'+k,`🔍 ${pn}留下了「${CASEM[k].t}」的推理${save.cs[k]?'':'（你破案後才看得到）'}`]);
 for(const k in P.cs)if(P.cs[k].ts>t&&CASEM[k]&&!(P.cn[k]&&P.cn[k].ts>t))out.push(['c:'+k,`🔍 ${pn}破了「${CASEM[k].t}」${'★'.repeat(P.cs[k].s)}`]);
 return out;
}
const MOLE={say:'',tm:0};
const MOLELINE=[
 '我有 6.02×10²³ 個兄弟姊妹，\n但大家都長得一樣',
 '鼴鼠的英文是 mole，\n所以我就是一莫耳！',
 '我只有一隻，\n不能算一莫耳啦…',
 '挖地道的時候，\n要記得配平喔',
 '鈉：一碰水就爆衝。\n我：一碰水就想睡',
 '惰性氣體都不理人，\n但我會理你',
 '觸媒不會改變終點，\n只會讓你更快到',
 '今天的 ΔG 是負的，\n適合自發地讀書',
 '鑽石會變石墨，\n只是很慢很慢，跟我一樣',
 '找不到答案的時候，\n就先數電子吧',
 '我的鼻子是粉紅色的，\n跟酚酞在鹼裡一樣',
 '緩衝溶液很穩，\n就像在地底很安心',
 '氫鍵很強，\n但沒有我們的感情強',
 '累了就休息一下，\n平衡也需要時間',
 '答錯沒關係，\n勒沙特列也會往回推'
];
function moleState(){
 if(moleMail().length)return'mail';
 if(teamToday()>=GOAL)return'dance';
 if(P&&P.ts&&Date.now()-P.ts>3*864e5)return'wait';
 return'idle';
}
function moleSVG(night){
 const st=moleState(),spots=[[326,216],[230,266],[90,266],[200,150],[270,152]];

 const cls=st==='idle'?'mole-peek':st==='dance'?'mole-dance':st==='mail'?'mole-bob':'';
 g+=`<g class="${cls}">${moleBody()}`;
 if(st==='mail')g+=`<text x="5" y="-17" font-size="10">✉️</text>`;
 if(st==='dance')g+=`<text x="-20" y="-24" font-size="8">🎵</text><text x="12" y="-28" font-size="7">✨</text>`;
 g+=`</g>`;
 if(st==='wait')g+=`<text x="10" y="-24" font-size="8" class="mole-zz">💤</text>`;
 g+=`<ellipse cx="0" cy="1" rx="15" ry="5" fill="${night?'#4a3a2a':'#8b6a45'}"/><circle cx="-8" cy="0" r="1.4" fill="${night?'#3a2d20':'#6e5234'}"/><circle cx="6" cy="1.5" r="1.1" fill="${night?'#3a2d20':'#6e5234'}"/>`;

 if(MOLE.say&&Date.now()<MOLE.tm){

 }
 return g;

function moleTap(){
 const ml=moleMail();if(ml.length)return mailModal(ml);
 const st=moleState();
 MOLE.say=st==='dance'?`今天一起答對 ${GOAL} 題了！\n我要跳舞慶祝～`:st==='wait'?`${paN()}好幾天沒來了，\n我在門口等等看`:MOLELINE[Math.floor(Math.random()*MOLELINE.length)];
 MOLE.tm=Date.now()+5000;if(TAB!=='town'){TAB='town'}render();
 clearTimeout(MOLE.to);MOLE.to=setTimeout(()=>{if(TAB==='town'&&!$('modal').classList.contains('show'))render()},5100);

function mailModal(ml){
 modal(`<div style="text-align:center">${moleIcon(64,true)}</div><h3 style="text-align:center">莫耳送信來了！</h3>
 <div class="small" style="text-align:center">${paN()}最近做了這些事，點一下可以去看</div>
 ${ml.map(([k,t])=>`<button class="opt" data-a="mlgo" data-v="${k}">${t}</button>`).join('')}

function mailGo(k){
 save.mlSeen=Date.now();persist();closeM();
 if(k==='nbk'){TAB='nbk';render()}
 else if(k.startsWith('l:')){const id=k.slice(2);openLesson(id);if(save.ls[id]){LS.k=LESM[id].c.length;LS.qi=LESM[id].q.length;drawLesson()}else toast(`讀完這章，最後就看得到${paN()}的補充`)}
 else if(k.startsWith('c:')){const id=k.slice(2);if(save.cs[id])openCase(id);else{openCase(id);toast(`先自己破案，才看得到${paN()}的推理喔`)}}
 else{save.nbSeen=Date.now();persist();render()}
}
