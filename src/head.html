<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ead7">
<title>魔法是可以配平的</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ead7;--paper:#fbf6ea;--paper2:#f6eedc;--ink:#3b2f22;--dim:#8a7a62;--line:#e0d2b4;--gold:#c08a2e;--gold2:#e7b75a;--me:#2f7d7a;--me2:#d5ece9;--her:#c8566b;--her2:#f6dbe0;--ok:#3f8f5a;--bad:#c0453a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:15px;line-height:1.55}
body{background:radial-gradient(ellipse at top,#fbf3e2 0%,var(--bg) 70%) fixed}
button{font-family:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:10px 12px calc(84px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:6px 2px 10px}
h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:21px;margin:0;color:#6b4a1c;letter-spacing:1px;cursor:default;user-select:none}
.sub{font-size:12px;color:var(--dim)}
.hstats{margin-left:auto;text-align:right;font-size:12px;color:var(--dim)}
.hstats b{color:var(--gold);font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fbf6eaee;backdrop-filter:blur(6px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:10}
nav .in{display:flex;max-width:640px;width:100%}
nav button{flex:1;border:none;background:none;padding:6px 0 4px;font-size:11.5px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;cursor:pointer}
nav button span{font-size:21px;line-height:1.1;filter:grayscale(.6);opacity:.75}
nav button.on{color:#6b4a1c;font-weight:700}
nav button.on span{filter:none;opacity:1}
nav .dot{position:absolute;top:3px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--her)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:10px;box-shadow:0 2px 0 #e7dbc0}
.card h3{margin:0 0 4px;font-family:'Noto Serif TC',serif;font-size:16px;color:#6b4a1c}
.sec{font-family:'Noto Serif TC',serif;font-size:16px;color:#6b4a1c;margin:16px 2px 8px;display:flex;align-items:baseline;gap:8px}
.sec small{font-family:'Noto Sans TC';font-size:12px;color:var(--dim);font-weight:400}
.sec.locked{color:#b3a68d}
.muted{color:var(--dim);font-size:13px}
.small{font-size:12px;color:var(--dim)}
.btn{display:block;width:100%;margin-top:8px;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--paper2);font-size:15px;cursor:pointer}
.btn.gold{background:linear-gradient(#f1c46c,#e0a744);border-color:#c99536;color:#4a3412;font-weight:700}
.btn.ghost{background:none;border-color:transparent;color:var(--dim)}
.btn:disabled{opacity:.45}
.btn:active{transform:scale(.985)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:#efe3c8;color:#7a5a24;margin-right:4px;white-space:nowrap}
.pill.me{background:var(--me2);color:var(--me)}
.pill.her{background:var(--her2);color:var(--her)}
.eq{font-family:'Noto Sans TC',ui-monospace,monospace;font-size:14.5px;background:#fffdf7;border:1px dashed var(--line);border-radius:9px;padding:7px 9px;margin:6px 0;overflow-x:auto;white-space:nowrap}
.eq .co{color:var(--gold);font-weight:700}
.eq .q{color:var(--her);font-weight:700}
/* town */
.banner{background:linear-gradient(135deg,#fff8e8,#f9ecd2);border:1px solid #ecd9ae;border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}
.banner b{color:#6b4a1c}
.town{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bld{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:10px 4px 8px;text-align:center;cursor:pointer;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px}
.bld .ic{font-size:32px;line-height:1.15}
.bld .nm{font-size:12.5px;font-weight:500}
.bld .bar{width:82%;height:6px;border-radius:3px;background:#eadfc6;overflow:hidden;display:flex;margin-top:4px}
.bld .bar i{display:block;height:100%}
.bld.wip .ic{filter:grayscale(1) opacity(.35)}
.bld.wip::after{content:'🏗️';position:absolute;top:6px;right:7px;font-size:15px}
.bld.done{border-color:#e2bf72;background:linear-gradient(#fffaf0,#fbefd3)}
.bld.done .ic{animation:bob 3s ease-in-out infinite}
.bld .need{position:absolute;top:5px;left:7px;font-size:11px;color:var(--her)}
.bld.lock{opacity:.45;cursor:default}
@keyframes bob{50%{transform:translateY(-3px)}}
.feed .ev{font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:6px}
.feed .ev:last-child{border:none}
.feed .t{color:var(--dim);font-size:11px;margin-left:auto;white-space:nowrap}
.who-me{color:var(--me);font-weight:700}
.who-her{color:var(--her);font-weight:700}
/* inventory */
.inv{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:18px;background:var(--paper);border:1px solid var(--line);font-size:13px;cursor:pointer}
.chip .sw{width:12px;height:12px;border-radius:50%;border:1px solid #0002;flex:none}
.chip b{color:var(--gold);font-weight:700}
.chip.raw{border-style:dashed}
.chip.zero{opacity:.45}
.rx{cursor:pointer}
.rx.no{opacity:.62}
.rx .miss{font-size:12px;color:var(--bad)}
.rx .can{font-size:12px;color:var(--ok)}
.tagrow{display:flex;justify-content:space-between;align-items:center}
/* modal */
#modal{position:fixed;inset:0;background:#2a1f1488;display:none;align-items:flex-end;justify-content:center;z-index:30}
#modal.show{display:flex}
.mbox{background:var(--paper);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:90vh;overflow-y:auto;animation:up .22s ease}
@media(min-width:700px){#modal{align-items:center}.mbox{border-radius:18px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.mbox h3{font-family:'Noto Serif TC',serif;color:#6b4a1c;margin:0 0 6px;font-size:18px}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:#fffdf7;font-size:14.5px;cursor:pointer;line-height:1.5}
.opt.right{border-color:var(--ok);background:#e6f3e8}
.opt.wrong{border-color:var(--bad);background:#f8e3df}
.opt:disabled{cursor:default}
.ex{background:#fff6e2;border-left:3px solid var(--gold);padding:7px 10px;border-radius:0 8px 8px 0;font-size:13.5px;margin:8px 0}
.ok{color:var(--ok);font-weight:700}
.bad{color:var(--bad);font-weight:700}
/* balance */
.bal{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 2px;margin:10px 0;font-size:15px}
.sp{display:flex;align-items:center;gap:2px}
.stp{display:flex;flex-direction:column;align-items:center}
.stp button{border:none;background:#efe3c8;border-radius:6px;width:28px;height:20px;font-size:11px;cursor:pointer;line-height:1}
.stp b{font-size:19px;color:var(--gold);min-width:24px;text-align:center;line-height:1.3}
.sp .f{font-size:15.5px;padding:0 2px}
.arrow{color:var(--dim);padding:0 4px}
.plus{color:var(--dim)}
table.tally{border-collapse:collapse;margin:6px auto;font-size:13.5px}
table.tally td,table.tally th{padding:3px 9px;border-bottom:1px solid var(--line);text-align:center}
table.tally th{color:var(--dim);font-weight:500}
table.tally td.y{color:var(--ok);font-weight:700}
table.tally td.n{color:var(--bad);font-weight:700}
.qty{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0}
.qty button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fffdf7;font-size:20px;cursor:pointer}
.qty b{font-size:24px;min-width:40px;text-align:center}
.need{margin:6px 0}
.need .lbl{display:flex;justify-content:space-between;font-size:13.5px}
.need .bar{height:9px;border-radius:5px;background:#eadfc6;overflow:hidden;display:flex;margin:3px 0 2px}
.need .bar i{display:block;height:100%}
.legend{font-size:11.5px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin:0 3px 0 8px}
.regions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.region{border:1px solid var(--line);border-radius:13px;padding:10px;background:var(--paper);cursor:pointer;text-align:center}
.region.on{border-color:var(--gold);box-shadow:0 0 0 2px #e7b75a55 inset}
.region .ic{font-size:28px}
.region .h{font-size:11.5px;color:var(--dim)}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px}
.gl .g{padding:9px 10px;border-radius:11px;border:1px solid var(--line);background:#fffdf7;cursor:pointer;text-align:left;font-size:13.5px}
.gl .g small{display:block;color:var(--dim);font-size:11.5px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.vs .p{border-radius:12px;padding:8px}
.vs .p.me{background:var(--me2)}
.vs .p.her{background:var(--her2)}
.vs .p b{font-size:22px;display:block}
.cardk{border-left:4px solid var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);opacity:0;background:#4a3412;color:#fff6e2;padding:9px 16px;border-radius:12px;font-size:14px;transition:.3s;z-index:40;max-width:88%;text-align:center;pointer-events:none}
.toast.show{transform:translateX(-50%);opacity:1}
.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.08)}}
.conf{position:fixed;top:-10px;font-size:20px;z-index:50;pointer-events:none;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.plaque{font-size:12px;background:#fbefd3;border:1px solid #ecd9ae;border-radius:8px;padding:4px 8px;margin-top:6px;display:inline-block}
.dq{font-size:15px;font-weight:500;margin:6px 0}
.hist td{padding:2px 8px;font-size:13px;text-align:center}
.foot{text-align:center;margin-top:20px}
.foot button{background:none;border:1px solid var(--line);border-radius:8px;color:var(--dim);font-size:12px;padding:5px 10px;cursor:pointer}
.bb{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.walk{animation:walk 20s linear infinite}
.mole-peek{animation:mpeek 7s ease-in-out infinite}
@keyframes mpeek{0%,12%{transform:translateY(16px)}22%,70%{transform:translateY(0)}76%{transform:translateY(-2px)}86%,100%{transform:translateY(16px)}}
.mole-bob{animation:mbob 1.2s ease-in-out infinite}
@keyframes mbob{50%{transform:translateY(-3px)}}
.mole-dance{animation:mdance .9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes mdance{25%{transform:rotate(-12deg) translateY(-3px)}75%{transform:rotate(12deg) translateY(-3px)}}
.mole-zz{animation:mzz 2.4s ease-in-out infinite}
@keyframes mzz{0%{opacity:0;transform:translate(0,0)}40%{opacity:1}100%{opacity:0;transform:translate(6px,-10px)}}
.moleic{display:inline-block;vertical-align:middle}
@keyframes walk{0%{transform:translateX(-20px)}50%{transform:translateX(370px)}50.01%{transform:translateX(370px) scaleX(-1)}100%{transform:translateX(-20px) scaleX(-1)}}
.smk{animation:smk 2.4s ease-out infinite}
@keyframes smk{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-14px)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1 id="title">⚗ 魔法是可以配平的</h1>
    <div class="sub" id="subt"></div>
  </div>
  <div class="hstats" id="hstats"></div>
</header>
<main id="main"></main>
<div class="foot" id="foot"></div>
</div>
<nav><div class="in" id="nav"></div></nav>
<div id="modal"></div>
<div class="toast" id="toast"></div>
